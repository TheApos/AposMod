<section id="affixes" data-sec>
  <h2>Афікси</h2>
  <p class="lead">Зброя з луту, від зомбі й у торговців отримує випадкові афікси — бонуси до характеристик, як у Borderlands. Скрафчена зброя їх не має. Що вища якість, то більше афіксів і то вони сильніші.</p>
  <div class="grid">
    <article class="card">
      <h3>Скільки афіксів</h3>
      <ul>
        <li><b>Якість 1:</b> без афіксів.</li>
        <li><b>Якість 2–3:</b> до 1 (шанс 50%).</li>
        <li><b>Якість 4–5:</b> до 2 (75% / 35%).</li>
        <li><b>Якість 6:</b> до 3 (100% / 60% / 30%), значення на максимумі.</li>
        <li>Однакових афіксів на одній зброї не буває. Після об'єднання двох гармат зайві афікси зникають; станок для з'єднання заздалегідь показує афікси результату і ті, що буде прибрано.</li>
        <li>Афікси видно вгорі підказки предмета, а на іконці є значок-зірочка.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Вогнепальна зброя, луки, ракетниця</h3>
      <div class="tagline">Значення: якість 2 → якість 6</div>
      <ul>
        <li><b>Скорострільність</b> +5% → +25%</li>
        <li><b>Розкид</b> −10% → −40%</li>
        <li><b>Дальність</b> +10% → +60%</li>
        <li><b>Шкода</b> +5% → +35%</li>
        <li><b>Швидкість перезарядки</b> +10% → +40%</li>
        <li><b>Дробини</b> (дробовики) +10% → +35%</li>
        <li><b>Друга куля</b> (пістолети, гвинтівки, автомати, лише якість 6): 2 кулі за постріл, кожна −40% шкоди</li>
        <li><b>Шкода в голову</b> +10% → +60%</li>
        <li><b>Розмір магазину</b> +10% → +60% (не на луках і арбалетах)</li>
        <li><b>Швидкість руху</b> зі зброєю в руках +2% → +10%</li>
        <li><b>Віддача</b> −10% → −50%</li>
      </ul>
    </article>
    <article class="card">
      <h3>Ближній бій</h3>
      <div class="tagline">Значення: якість 2 → якість 6</div>
      <ul>
        <li><b>Шкода</b> +5% → +35%</li>
        <li><b>Швидкість атаки</b> +4% → +20%</li>
        <li><b>Витривалість на удар</b> −10% → −40%</li>
        <li><b>Шкода в голову</b> +10% → +60%</li>
        <li><b>Дальність удару</b> +5% → +20%</li>
        <li><b>Швидкість руху</b> +2% → +10%</li>
        <li><b>Лікування від шкоди</b> 1% → 6% від завданої шкоди</li>
        <li><b>Шанс відрубати кінцівку</b> +5% → +30%</li>
        <li><b>Міцність</b> +20% → +80%</li>
        <li><b>Шкода по блоках</b> +10% → +60%</li>
      </ul>
    </article>
  </div>
</section>

<section id="elites" data-sec>
  <h2>Елітні зомбі та Ерідій</h2>
  <p class="lead">Іноді зомбі з'являється елітним: над головою його ім'я з модифікаторами, як у Borderlands. Він сильніший, але гарантовано дає зброю з афіксами й Ерідій, а за Ерідій можна довести свою гармату до ідеалу.</p>
  <div class="grid">
    <article class="card legendary">
      <h3>Еліти</h3>
      <div class="tagline">Шанс 2% на початку → 5% у пізній грі · ★ = 1 модифікатор, ★★ після gamestage 100, ★★★ (25% з них) після gamestage 200</div>
      <ul>
        <li>Сильніші з кожною зіркою: ★ здоров'я x3 і шкода x2, ★★ x6 і x4, ★★★ x12 і x6 (змінюється командами <code>aposelite health 3 6 12</code> / <code>aposelite damage 2 4 6</code> або health1-3 / damage1-3 у Settings.xml). Коли еліта вперше потрапляє в поле зору, банер називає її і дає пораду щодо кожного модифікатора (<code>aposelite announce off</code> вимикає). Над назвою зірки: <b>★</b> жовта, <b>★★</b> помаранчеві, <b>★★★</b> червоні. Видно до 40 м, крізь стіни — ні.</li>
        <li>Лут на землі світиться і має промінь угору, як у Borderlands, — його видно здалеку: Ерідій фіолетовим, зброя з афіксами золотим, легендарки помаранчевим. За бажанням — білим над ванільними мішками з лутом із зомбі: <code>aposbags on</code> або <code>&lt;LootBeam bags="true"/&gt;</code> у Settings.xml (за замовчуванням вимкнено: на кривавий місяць променів дуже багато).</li>
        <li><b>Нагорода:</b> ★ — зброя з афіксами якості 3–5 і 3–6 Ерідію; ★★ — якість 5–6, 8–15 Ерідію, 2% легендарка; ★★★ — якість 6, 20–30 Ерідію, 10% легендарка. Для майстерності зброї еліта = 5 вбивств. Ерідій випадає завжди; зброя — з шансом за біомом, частіше там, де еліти сильніші: сосновий ліс 10%, випалений ліс 20%, пустеля 30%, сніги 40%, пустки 50% (інші біоми 100%, <code>weaponDrop</code>). Змінюється в Settings.xml (<code>dropPineForest</code>, <code>dropBurntForest</code>, <code>dropDesert</code>, <code>dropSnow</code>, <code>dropWasteland</code>, 0–100) або в грі: <code>aposelite drop wasteland N</code> для одного біому, <code>aposelite drop N</code> для всіх. Еліти кидають лише зброю гравця (не зброю NPC з NPC-модів); <code>aposelite weapons</code> показує список, а <code>weaponExclude</code> у Settings.xml прибирає зайве (імена предметів або їх початок через кому, наприклад <code>gunExplosives,meleeToolAxe</code>).</li>
      </ul>
    </article>
    <article class="card">
      <h3>Значки модифікаторів</h3>

        <li>Як заповнити: вдягніть перший сет, натисніть Alt+2, вдягніть другий сет з рюкзака, натисніть Alt+3 і вдягніть третій.</li>
        <li>Гардероб зберігається разом зі світом і не випадає після смерті.</li>
      </ul>
    </article>

<section id="gear" data-sec>
  <h2>Моди та легендарна зброя</h2>
  <div class="grid">
    <article class="card">
      <h3>Мод <span class="trait">Energy Shield</span></h3>
      <div class="tagline">Нагрудник · верстак, лут модів броні, торговці</div>
      <ul>
        <li>Поки щит заряджений, дальні атаки (кулі, стріли, плювки) вам не шкодять.</li>
        <li>Будь-яке влучання розряджає щит. Він заряджається знову через 5 с без шкоди.</li>
      </ul>
      <div class="k">Рецепт</div>
      <div>6 електродеталей, 4 механічні деталі, 10 полімерів, 10 кованого заліза, 2 рулони ізоленти.</div>
    </article>
    <article class="card">
      <h3>Стихійні моди</h3>
      <div class="tagline">Будь-яка зброя · один стихійний мод на зброю · верстак</div>
      <ul>
        <li><b>Incendiary:</b> з шансом 30% підпалює на 10 с: щосекунди 10% шкоди вашого останнього удару (щонайменше 10). (4 олії)</li>
        <li><b>Tesla</b> (не ставиться на жезли — вони й так шокують): з шансом 20% шокує на 1.5 с: щосекунди 15% шкоди останнього удару (щонайменше 10). (5 електродеталей)</li>
        <li><b>Corrosive:</b> з шансом 25% роз'їдає на 6 с: −25 фізичного опору, щосекунди 8% шкоди останнього удару (щонайменше 8). (2 кислоти)</li>
      </ul>
      <div class="tagline">Плюс 3 механічні деталі й 6 полімерів у кожному рецепті</div>
    </article>
    <article class="card legendary">
      <h3><span class="trait">Легендарна зброя</span></h3>
      <div class="tagline">Золота назва · значок-трофей · завжди якість 6 · 4% у фінальних скринях ★4, 10% у ★5 · Black Market</div>
      <p>Кожна легендарка має 3 постійні афікси на максимумі якості 6 і власну фішку, тому вона завжди не гірша за найкращу зброю з випадковими афіксами.</p>
      <ul>
        <li><b>Unkempt Harold</b> (.44 Desert Vulture): 3 кулі за постріл віялом. <i>Шкода +35%, скорострільність +25%, магазин +60%.</i></li>
        <li><b>Lady Fist</b> (9-мм пістолет): +50% шкоди, кожне влучання лікує 5 HP, хедшот — 25 HP. <i>Шкода в голову +60%, розкид −40%, перезарядка +40%.</i></li>
        <li><b>Dragon's Breath</b> (помповий дробовик): +20%, кожне влучання підпалює. <i>Дробини +35%, шкода +35%, перезарядка +40%.</i></li>
        <li><b>The Ripper</b> (мачете): +40%, кожен удар спричиняє кровотечу, по тих, хто вже стікає кров'ю, ще +50%; вбивство лікує 20 HP. <i>Шкода +35%, швидкість атаки +20%, лікування 6% від шкоди.</i></li>
        <li><b>Thunderclap</b> (сталева кувалда): +25%, силовий удар шокує всіх у 4 м. Кожне вбивство дає грозовий заряд, на 3 зарядах силовий удар кличе блискавку: 150 шкоди й 3 с шоку всім у 6 м. <i>Шкода +35%, витривалість на удар −40%, шкода в голову +60%.</i></li>
        <li><b>Hornet</b> (SMG-5): +40% шкоди, влучання з шансом 50% роз'їдає кислотою, по роз'їдених цілях ще +25%. <i>Магазин +60%, скорострільність +25%, віддача −50%.</i></li>
        <li><b>Storm Fist</b> (сталеві кастети): +20%, удар з шансом 25% підпалює і з шансом 25% шокує, тож Confusion вмикається сама. <i>Швидкість атаки +20%, шкода +35%, швидкість руху +10%.</i></li>
        <li><b>Artemis</b> (блочний лук): +40% шкоди, кожна стріла підпалює й розлітається на 10 уламків по 100 (або половині шкоди стріли). <i>Шкода +35%, шкода в голову +60%, перезарядка +40%.</i></li>
        <li><b>Big Boom</b> (ракетниця): з шансом 50% наступна ракета безкоштовна. <i>Шкода +35%, перезарядка +40%, дальність +60%.</i></li>
        <li><b>Predator</b> (снайперська гвинтівка): +25%, кожен хедшот рикошетить на 15 м: 100 шкоди й 2 с оглушення. <i>Шкода в голову +60%, дальність +60%, віддача −50%.</i></li>
      </ul>
    </article>

inters x2 and in the head; the arrow -50%"],"ru":["Осколки x2 и в голову; стрела -50%"],"uk":["Уламки ×2 і в голову; стріла −50%"]},"syn":[{"t":"S6","w":"B6","x":{"en":"Marksmanship from branch B strengthens headshots, but the arrow is weaker — better to shoot at the center of a group.","ru":"Меткость из ветки B усиливает хедшоты, но стрела слабее — лучше стрелять в центр группы.","uk":"Влучність з гілки B посилює хедшоти, але стріла слабша — краще стріляти в центр групи."}}]},{"id":"B1","br":"B","tier":1,"col":0,"max":3,"icon":"muscle","name":{"en":"Full Draw","ru":"Полное натяжение","uk":"Повний натяг"},"desc":{"en":"A fully drawn arrow hits harder. Strength = rank x your Agility level.","ru":"Полностью натянутая стрела бьёт сильнее. Сила = ранг x уровень вашей Ловкости.","uk":"Повністю натягнута стріла б'є сильніше. Сила = ранг x рівень вашої Ловкості."},"ranks":{"en":["+3% per Agility level","+5% per Agility level","+10% per Agility level (max +100%)"],"ru":["+3% за уровень Ловкости","+5% за уровень Ловкости","+10% за уровень Ловкости (до +100%)"],"uk":["+3% за рівень Ловкості","+5% за рівень Ловкості","+10% за рівень Ловкості (до +100%)"]},"syn":[{"t":"S2","w":null,"x":{"en":"Resonance: Agility matters for the bow again (instead of the Archery perk).","ru":"Резонанс: Ловкость снова важна для лука (вместо перка «Стрельба из лука»).","uk":"Резонанс: Ловкість знову важить для лука (замість перка Archery)."}}]},{"id":"B2","br":"B","tier":1,"col":1,"max":3,"icon":"pierce","name":{"en":"Piercing Arrow","ru":"Сквозная стрела","uk":"Наскрізна стріла"},"desc":{"en":"A fully drawn arrow goes through the zombie and hits those behind it in a line (up to 15 m further).","ru":"Полностью натянутая стрела прошивает зомби и бьёт тех, кто стоит за ним в линию (до 15 м дальше).","uk":"Повністю натягнута стріла прошиває зомбі і б'є тих, хто стоїть за ним у лінії (до 15 м далі)."},"ranks":{"en":["+1 zombie behind, 50% damage","+2 zombies, 60%","+4 zombies, full damage"],"ru":["+1 зомби за целью, 50% урона","+2 зомби, 60%","+4 зомби, полный урон"],"uk":["+1 зомбі за ціллю, 50% шкоди","+2 зомбі, 60% шкоди","+4 зомбі, повна шкода"]},"syn":[]},{"id":"B3","br":"B","tier":2,"col":0,"max":3,"icon":"skull","name":{"en":"Hunter's Wound","ru":"Охотничья рана","uk":"Мисливська рана"},"desc":{"en":"A fully drawn hit leaves a wound for 8 s: the zombie takes more damage from all your attacks (any weapon) and moves slower. Up to 2 wounds.","ru":"Попадание полностью натянутой стрелой оставляет рану на 8 с: зомби получает больше урона от всех ваших атак (любым оружием) и медленнее двигается. До 2 ран.","uk":"Влучання повністю натягнутою стрілою залишає рану на 8 с: зомбі отримує більше шкоди від усіх ваших атак (будь-якою зброєю) і повільніше рухається. До 2 ран."},"ranks":{"en":["Per wound +20% damage, -20% speed","Per wound +30%, -25%","Per wound +50%, -40%"],"ru":["За рану +20% урона, -20% скорости","За рану +30%, -25%","За рану +50%, -40%"],"uk":["За рану +20% шкоди, -20% швидкості","За рану +30%, -25%","За рану +50%, -40%"]},"syn":[{"t":"S4","w":"X_XBOW","x":{"en":"Together with the crossbow Mark: a marked and wounded zombie melts from any weapon.","ru":"Вместе с Меткой арбалета: помеченный и раненый зомби тает от любого оружия.","uk":"Разом з Міткою арбалета: позначений і поранений зомбі тане від будь-якої зброї."}}]},{"id":"B4","br":"B","tier":2,"col":1,"max":3,"icon":"reload","name":{"en":"Quick Draw","ru":"Быстрое натяжение","uk":"Швидкий натяг"},"desc":{"en":"The bow draws faster.","ru":"Лук натягивается быстрее.","uk":"Лук натягується швидше."},"ranks":{"en":["+15% draw speed","+30%","+50%"],"ru":["+15% скорости натяжения","+30%","+50%"],"uk":["+15% швидкості натягу","+30%","+50%"]},"syn":[]},{"id":"B5","br":"B","tier":3,"col":0,"max":1,"icon":"drop","notable":true,"name":{"en":"Shadow","ru":"Тень","uk":"Тінь"},"desc":{"en":"After a silent kill (the zombie did not see you) zombies do not notice you for 5 s, and the next arrow counts as from stealth (x2).","ru":"После тихого убийства (зомби вас не видел) 5 с вас не замечают, а следующая стрела считается из скрытности (x2).","uk":"Після тихого вбивства (зомбі вас не бачив) 5 с вас не помічають, а наступна стріла вважається зі скритності (x2)."},"ranks":{"en":["Silent kill -> 5 s unnoticed, the next arrow x2"],"ru":["Тихое убийство -> 5 с незаметности, следующая стрела x2"],"uk":["Тихе вбивство -> 5 с непомітності, наступна стріла x2"]},"syn":[{"t":"S1","w":"B3","x":{"en":"Shadow: a chain of silent kills, each with +150%.","ru":"Тень: цепь тихих убийств, каждое с +150%.","uk":"Засідка: ланцюг тихих вбивств, кожне з +150%."}}]},{"id":"B6","br":"B","tier":3,"col":1,"max":2,"icon":"target","name":{"en":"Marksmanship","ru":"Меткость","uk":"Влучність"},"desc":{"en":"A fully drawn headshot hits harder.","ru":"Выстрел в голову полностью натянутой стрелой сильнее.","uk":"Хедшот з повністю натягнутої стріли сильніший."},"ranks":{"en":["+25%","+75%"],"ru":["+25%","+75%"],"uk":["+25%","+75%"]},"syn":[]},{"id":"B7","br":"B","tier":4,"col":0,"span":2,"max":2,"icon":"refund","name":{"en":"Arrow Recovery","ru":"Сборщик стрел","uk":"Збирач стріл"},"desc":{"en":"The arrow that killed a zombie goes straight back into your backpack.","ru":"Стрела, убившая зомби, сразу возвращается в рюкзак.","uk":"Стріла, що вбила зомбі, одразу повертається в інвентар — не треба підбирати."},"ranks":{"en":["50% chance","Always"],"ru":["Шанс 50%","Всегда"],"uk":["50% шанс","Завжди"]},"syn":[]},{"id":"B8","br":"B","tier":5,"col":0,"span":2,"max":1,"icon":"duel","cap":true,"name":{"en":"Lance Arrow","ru":"Стрела-копьё","uk":"Списоголова стріла"},"desc":{"en":"Capstone. A fully drawn arrow deals x2.5 and pierces every zombie in the line, wounding each. Downside: a fully drawn arrow does not splinter; splinters come only from quick (not fully drawn) shots.","ru":"Капстоун. Полностью натянутая стрела x2.5 урона и прошивает всех зомби в линии, каждому — Охотничья рана. Минус: полностью натянутая стрела не разлетается на осколки — осколки только от быстрых выстрелов.","uk":"Капстоун. Повністю натягнута стріла ×2.5 шкоди і прошиває всіх зомбі в лінії без обмеження, кожному накладає Мисливську рану. Мінус: повністю натягнута стріла не розлітається на уламки — Розщеплення лишається лише для швидких (неповних) пострілів."},"ranks":{"en":["Full draw x2.5, pierces the line with a wound; splinters only from quick shots"],"ru":["Полное натяжение x2.5, прошивает линию с раной; осколки только от быстрых выстрелов"],"uk":["Повний натяг ×2.5, прошиває всю лінію з раною; уламки лише від неповного натягу"]},"syn":[{"t":"S6","w":"A1","x":{"en":"Splinters stay for quick shots: a full draw — down the line, a quick one — at the crowd around.","ru":"Осколки остаются для быстрых выстрелов: полное натяжение — по линии, быстрый — по толпе вокруг.","uk":"Уламки лишаються для швидких пострілів: повний натяг — по лінії, швидкий — по натовпу навколо."}},{"t":"S1","w":"B2","x":{"en":"Piercing Arrow is no longer needed for line length — the capstone pierces everyone.","ru":"Сквозная стрела уже не нужна для длины линии — капстоун прошивает всех.","uk":"Наскрізна стріла вже не потрібна для довжини лінії — капстоун прошиває всіх."}}],"breaks":[{"ids":["A1","A2","A3","A4","A5","A6","A7","H1","H2"],"lvl":"weak","why":{"en":"Splinters only come from quick (partial) shots; a fully drawn arrow does not scatter.","ru":"Осколки дают только быстрые (неполные) выстрелы; полностью натянутая стрела не разлетается.","uk":"Уламки дають лише швидкі (неповні) постріли; повністю натягнута стріла не розлітається."}},{"ids":["H3"],"lvl":"dead","why":{"en":"Thousand Needles only works with splinters of a fully drawn arrow, and it no longer scatters.","ru":"Тысяча игл работает только с осколками полностью натянутой стрелы, а она больше не разлетается.","uk":"Тисяча голок працює лише з уламками повністю натягнутої стріли, а вона більше не розлітається."}}]},{"id":"H1","br":"H","row":3,"need":5,"max":1,"icon":"frag","name":{"en":"Barbed Splinters","ru":"Зазубренные осколки","uk":"Зазубрені уламки"},"desc":{"en":"Hybrid. Every splinter leaves a Hunter's Wound too (1 wound), so one arrow into a crowd prepares the whole group.","ru":"Гибрид. Каждый осколок тоже оставляет Охотничью рану (1 рану), так что одна стрела в толпу «готовит» всю группу.","uk":"Гібрид. Кожен уламок теж залишає Мисливську рану (1 рану), тож одна стріла в натовп «готує» всю групу під наступні постріли."},"ranks":{"en":["Splinter = 1 Hunter's Wound"],"ru":["Осколок = 1 Охотничья рана"],"uk":["Уламок = 1 Мисливська рана"]},"syn":[{"t":"S1","w":"B3","x":{"en":"Hunter's Wound: 10 splinters = 10 wounded and slowed zombies.","ru":"Охотничья рана: 10 осколков = 10 раненых и замедленных зомби.","uk":"Мисливська рана: 10 уламків = 10 поранених і сповільнених зомбі."}}]},{"id":"H2","br":"H","row":4,"need":5,"max":1,"icon":"burst","name":{"en":"Distraction","ru":"Отвлечение","uk":"Відволікання"},"desc":{"en":"Hybrid. Splinters that find no zombie hit the ground and make noise: zombies within 8 m go to look at the spot.","ru":"Гибрид. Осколки, не нашедшие зомби, бьют в землю и шумят: зомби в 8 м идут проверить место.","uk":"Гібрид. Уламки, що не знайшли зомбі, б'ють у землю й шумлять: зомбі в 8 м ідуть перевірити місце."},"ranks":{"en":["A missed splinter -> zombies go to the noise"],"ru":["Промах осколка -> зомби идут на шум"],"uk":["Промах уламка -> зомбі йдуть на шум"]},"syn":[{"t":"S1","w":"B3","x":{"en":"Shadow: a zombie turned away \"does not see\" you — +150%.","ru":"Тень: отвернувшийся зомби вас «не видит» — +150%.","uk":"Засідка: відвернутий зомбі вас «не бачить» — +150%."}}]},{"id":"H3","br":"H","row":1,"need":8,"max":1,"icon":"star","big":true,"name":{"en":"Thousand Needles","ru":"Тысяча игл","uk":"Тисяча голок"},"desc":{"en":"Big hybrid (8 points in each branch). Splinters of a fully drawn arrow get the Full Draw bonus and each pierces one more zombie.","ru":"Большой гибрид (8 очков в каждой ветке). Осколки по :"A","tier":2,"col":1,"max":3,"icon":"skull","name":{"en":"Weak Spot","ru":"Слабое место","uk":"Слабке місце"},"desc":{"en":"Your body hits on a marked zombie count as headshots for other classes: the pistol Headhunter streak, the rifle Ricochet.","ru":"Ваши попадания в тело по помеченному зомби считаются выстрелами в голову для других классов: серия Охотника пистолета, Рикошет винтовки.","uk":"Ваші влучання в тіло по позначеному зомбі рахуються хедшотами для фішок інших класів: серії Мисливця пістолета, рикошету гвинтівки тощо."},"ranks":{"en":["25% of body hits","50% of body hits","All body hits"],"ru":["25% попаданий в тело","50% попаданий в тело","Все попадания в тело"],"uk":["25% влучань у тіло","50% влучань у тіло","Усі влучання в тіло, і вони б'ють як у голову"]},"syn":[{"t":"S4","w":"X_PISTOL","x":{"en":"Pistol: the Headhunter streak builds from body shots on the marked zombie.","ru":"Пистолет: серия Охотника набирается выстрелами в тело помеченного.","uk":"Пістолет: серія Мисливця набирається пострілами в тіло позначеного."}},{"t":"S4","w":"X_RIFLE","x":{"en":"Rifle: a ricochet from a body hit on the marked zombie.","ru":"Винтовка: рикошет от попадания в тело помеченного.","uk":"Гвинтівка: рикошет від влучання в тіло позначеного."}}]},{"id":"A5","br":"A","tier":3,"col":0,"max":1,"icon":"flame","notable":true,"name":{"en":"Elemental Mark","ru":"Метка стихий","uk":"Мітка стихій"},"desc":{"en":"Elements on a marked zombie (fire, shock, acid, bleeding) hit 50% harder.","ru":"Стихии на помеченном зомби (огонь, ток, кислота, кровотечение) бьют на 50% сильнее.","uk":"Стихії на позначеному зомбі (вогонь, струм, кислота, кровотеча) б'ють на 50% сильніше."},"ranks":{"en":["Elements on the marked +50%"],"ru":["Стихии на помеченном +50%"],"uk":["Стихії на позначеному +50%"]},"syn":[{"t":"S3","w":"E_ELEM","x":{"en":"Any elemental weapon: fire bolt, acid arrow, Tesla mod, bleeding.","ru":"Любое стихийное оружие: огненный болт, кислотная стрела, мод тесла, кровотечение.",  s (almost at once)"],"ru":["1.5 с","1 с","0.3 с (почти сразу)"],"uk":["1.5 с","1 с","0.3 с (майже одразу)"]},"syn":[]},{"id":"B3","br":"B","tier":2,"col":0,"max":3,"icon":"flame","name":{"en":"Incendiary Mix","ru":"Зажигательная смесь","uk":"Запальна суміш"},"desc":{"en":"The charge blast sets those it hits on fire.","ru":"Взрыв заряда поджигает задетых.","uk":"Вибух заряду підпалює зачеплених."},"ranks":{"en":["25% to ignite","50% to ignite","Always ignites, and a 1 s shock"],"ru":["Поджог 25%","Поджог 50%","Поджог всегда и шок 1 с"],"uk":["Підпал 25%","Підпал 50%","Підпал завжди і шок 1 с"]},"syn":[{"t":"S3","w":null,"x":{"en":"Fire + shock from one blast = the Confusion reaction across the whole group.","ru":"Огонь + ток от одного взрыва = реакция «Замешательство» по всей группе.","uk":"Вогонь + шок від одного вибуху = реакція «Confusion» по всій групі."}}]},{"id":"B4","br":"B","tier":2,"col":1,"max":3,"icon":"reload","name":{"en":"Quick Crank","ru":"Быстрый ворот","uk":"Швидкий ворот"},"desc":{"en":"The crossbow reloads faster (slow in vanilla).","ru":"Арбалет перезаряжается быстрее (в ванили — медленно).","uk":"Арбалет перезаряджається швидше (у ванілі — повільно)."},"ranks":{"en":["+15% reload","+30%","+60%"],"ru":["+15% перезарядки","+30%","+60%"],"uk":["+15% перезарядки","+30%","+60%"]},"syn":[]},{"id":"B5","br":"B","tier":3,"col":0,"max":1,"icon":"skull","notable":true,"name":{"en":"Inner Charge","ru":"Внутренний заряд","uk":"Внутрішній заряд"},"desc":{"en":"A bolt in the head drives the charge inside: the target takes triple blast damage, and if it dies the head bursts and the blast knocks down everyone in the radius.","ru":"Болт в голову загоняет заряд внутрь: цель получает тройной урон взрыва, а если умирает — голова разрывается и взрыв сбивает с ног всех в радиусе.","uk":"Болт у голову заганяє заряд усередину: ціль отримує потрійну шкоду вибуху, а якщо помирає — голова розривається і вибух валить з ніг усіх у радіусі. Працює з будь-яким запалом."},"ran й заряд и метка на соседа"],"uk":["Вбивство позначеного вибухом → новий заряд і мітка на сусіда"]},"syn":[{"t":"S1","w":"A6","x":{"en":"Mark Hop: the chain of marks and charges goes on.","ru":"Прыжок метки: цепь меток и зарядов идёт дальше.","uk":"Перескок мітки: ланцюг міток і зарядів іде далі."}}]}],"presets":[{"n":{"en":"Mark (A18 + B7)","ru":"Метка (A18 + B7)","uk":"Мітка (A18 + B7)"},"r":{"A1":3,"A2":3,"A3":3,"A4":3,"A5":1,"A6":2,"A7":2,"A8":1,"B1":3,"B2":3,"B3":1}},{"n":{"en":"Charge (B18 + A7)","ru":"Заряд (B18 + A7)","uk":"Заряд (B18 + A7)"},"r":{"B1":3,"B2":3,"B3":3,"B4":3,"B5":1,"B6":2,"B7":2,"B8":1,"A1":3,"A2":3,"A3":1}},{"n":{"en":"Hybrid (11 + 11 + 3)","ru":"Гибрид (11 + 11 + 3)","uk":"Гібрид (11 + 11 + 3)"},"r":{"A1":3,"A2":2,"A3":2,"A4":2,"A5":1,"A6":1,"B1":3,"B2":2,"B3":2,"B4":2,"B5":1,"B6":1,"H1":1,"H2":1,"H3":1}}]},"knives":{"key":"Blades","name":{"en":"Knives and machetes","ru":"Ножи и мачете","uk":"Ножі й мачете"},"base":{"icon":"blood","name":{"en":"Bloodsucker","ru":"Кровопийца","uk":"Кровопивця"},"desc":{"en":"Every hit is a regen stack (+1 HP/s, a power hit +2); stacks last 5 s from the last hit, max 2 (full Assassin set +2). A power hit makes the zombie bleed. Branch A grows the stacks and bleeding (long fights), branch B crits, back hits and finishing.","ru":"Каждый удар — стак регенерации (+1 HP/с, силовой +2); стаки держатся 5 с от удара, максимум 2 (полный сет Ассасина +2). Силовой удар вызывает кровотечение. Ветка A развивает стаки и кровотечение (долгий бой), ветка B — криты, удары в спину и добивание.","uk":"Кожен удар — стак регенерації (+1 HP/с, силовий +2); стаки тримаються 5 с від удару, максимум 2 (повний сет Асасина +2). Силовий удар викликає кровотечу. Гілка A розвиває стаки й кровотечу (довгий бій), гілка B — криті, удари в спину й добивання."}},"br":{"A":{"name":{"en":"Bloodsucker","ru":"Кровопийца","uk":"Кровопивця"},"idea":{"en":"Long fight: more stacks, bleeding from every hit, blood spreads through the crowd, vampirism.", те атаковать.","uk":"Капстоун. Силовий удар на бігу вперед стає ривком: ви пролітаєте 6 м крізь натовп, і кожен на шляху пробитий, збитий з ніг і отримує ×2 шкоди. Мінус: після ривка 1.5 с ви не можете атакувати — ви посеред натовпу, тож обирайте, куди прориватися."},"ranks":{"en":["A running power hit - a 6 m dash: x2 and knockdown on the way; no attacks for 1.5 s"],"ru":["Силовой на бегу — рывок 6 м: x2 и сбивание на пути; 1.5 с без атак"],"uk":["Силовий на бігу — ривок 6 м: усі на шляху ×2 і збиті; 1.5 с без атак після"]},"syn":[{"t":"S1","w":"A6","x":{"en":"Hit and Back: after the dash, you get out of the crowd faster.","ru":"Удар и отход: после рывка быстрее выбраться из толпы.","uk":"Удар і відхід: після ривка швидше вибратися з натовпу."}},{"t":"S1","w":"A5","x":{"en":"Tip in the Wound: the dash leaves the tip in the first target on the path — turn around and finish it.","ru":"Остриё в ране: рывок оставляет остриё в первом на пути — развернитесь и добейте его.","uk":"Вістря в рані: ривок лишає вістря в першому на шляху — розверніться й добийте його."}}]},{"id":"B1","br":"B","tier":1,"col":0,"max":3,"icon":"bolt","name":{"en":"Quick Thrusts","ru":"Быстрые уколы","uk":"Швидкі уколи"},"desc":{"en":"Faster attacks. Strength = rank x your Agility level.","ru":"Быстрее удары. Сила = ранг x уровень вашей Ловкости.","uk":"Швидші удари. Залежить від атрибута Ловкість: ранг × рівень Ловкості."},"ranks":{"en":["+2% x Agility (max +20%)","+3% x Agility (max +30%)","+6% x Agility (max +60%)"],"ru":["+2% x Ловкость (до +20%)","+3% x Ловкость (до +30%)","+6% x Ловкость (до +60%)"],"uk":["+2% × Ловкість (до +20%)","+3% × Ловкість (до +30%)","+6% × Ловкість (до +60%)"]},"syn":[{"t":"S2","w":null,"x":{"en":"Resonance with a \"foreign\" attribute: Agility, not Perception.","ru":"Резонанс с «чужим» атрибутом: Ловкость, а не Восприятие.","uk":"Резонанс з «чужим» атрибутом: Ловкість, а не Сприйняття."}}]},{"id":"B2","br":"B","tier":1,"col":1,"max":3,"icon":"blood","name":{"en":"Deep Thrust","ru":"Глубокий укол","uk":"Глибокий укол"},"desc":{"en":"A normal thrust may cause bleeding.","ru":"Обычный укол может вызвать кровотечение.","uk":"Звичайний укол може викликати кровотечу."},"ranks":{"en":["15% chance","30% chance","60% chance"],"ru":["Шанс 15%","Шанс 30%","Шанс 60%"],"uk":["15% шанс","30% шанс","60% шанс"]},"syn":[{"t":"S3","w":null,"x":{"en":"Bleeding is the 4th element: with fire Roasting, with acid Sepsis.","ru":"Кровотечение — 4-я стихия: с огнём «Запекание», с кислотой «Сепсис».","uk":"Кровотеча — 4-та стихія: з вогнем «Запікання», з кислотою «Сепсис»."}}]},{"id":"B3","br":"B","tier":2,"col":0,"max":3,"icon":"target","name":{"en":"Head Thrust","ru":"Укол в голову","uk":"Укол у голову"},"desc":{"en":"A spear hit to the head hits harder - aim, do not just poke.","ru":"Удар копьём в голову бьёт сильнее — цельтесь, а не просто тыкайте.","uk":"Удар списом у голову б'є сильніше — цільтеся, а не просто тицяйте."},"ranks":{"en":["+30%","+60%","+120%"],"ru":["+30%","+60%","+120%"],"uk":["+30%","+60%","+120%"]},"syn":[]},{"id":"B4","br":"B","tier":2,"col":1,"max":3,"icon":"chain","name":{"en":"Thrust Chain","ru":"Серия уколов","uk":"Серія уколів"},"desc":{"en":"Every next hit on the same zombie (no more than 1 s apart) hits harder, up to 5 times. Another target or a pause - the chain burns out.","ru":"Каждый следующий удар по той же цели (с паузой не больше 1 с) сильнее, до 5 раз. Другая цель или пауза — серия сгорает.","uk":"Кожен наступний удар по тій самій цілі (з паузою не довше 1 с) сильніший, до 5 разів. Перемкнулись на іншу ціль або зупинились — серія згоряє."},"ranks":{"en":["+5% per hit (max +25%)","+8% per hit (max +40%)","+15% per hit (max +75%)"],"ru":["+5% за удар (до +25%)","+8% за удар (до +40%)","+15% за удар (до +75%)"],"uk":["+5% за удар (до +25%)","+8% за удар (до +40%)","+15% за удар (до +75%)"]},"syn":[]},{"id":"B5","br":"B","tier":3,"col":0,"max":1,"icon":"duel","notable":true,"name":{"en":"Parry","ru":"Парирование","uk" ар серії уколів — удар навколо себе (усі зомбі в досяжності списа) з кровотечею. Мінус: відкрита стійка — отримана шкода +20%."},"ranks":{"en":["Every 4th chain hit - a sweep with bleeding; you take +20%"],"ru":["Каждый 4-й удар серии — вихрь с кровотечением; получаемый урон +20%"],"uk":["Кожен 4-й удар серії — вихор з кровотечею; отримана шкода +20%"]},"syn":[{"t":"S1","w":"B4","x":{"en":"Thrust Chain: the whirlwind comes only while the chain is alive.","ru":"Серия уколов: вихрь приходит только пока серия жива.","uk":"Серія уколів: вихор приходить тільки поки серія жива."}}]},{"id":"H1","br":"H","row":3,"need":5,"max":1,"icon":"blood","name":{"en":"Bloody Skewer","ru":"Кровавый шампур","uk":"Кривавий шампур"},"desc":{"en":"Hybrid. Everyone a power hit goes through bleeds.","ru":"Гибрид. Все, кого пробил силовой удар, кровоточат.","uk":"Гібрид. Усі, кого пробив силовий удар, кровоточать."},"ranks":{"en":["Pierced by a power hit - bleeding"],"ru":["Пробитые силовым — кровотечение"],"uk":["Пробиті силовим — кровотеча"]},"syn":[{"t":"S1","w":"A2","x":{"en":"Through Strike: 6 bleeding targets with one hit.","ru":"Сквозной удар: 6 кровоточащих одним ударом.","uk":"Наскрізний удар: 6 кровоточивих одним ударом."}}]},{"id":"H2","br":"H","row":4,"need":5,"max":1,"icon":"target","name":{"en":"Parting Shot","ru":"Удар на отходе","uk":"Удар на відході"},"desc":{"en":"Hybrid. The first hit after Hit and Back (when you stepped 2.5 m away) counts as a head thrust.","ru":"Гибрид. Первый удар после «Удара и отхода» (когда вы отошли на 2.5 м) считается уколом в голову.","uk":"Гібрид. Перший удар після «Удару і відходу» (коли ви встигли відійти на 2.5 м) рахується уколом у голову."},"ranks":{"en":["Back at distance -> the next hit as to the head"],"ru":["Отошли на дистанцию -> следующий удар как в голову"],"uk":["Відійшли на дистанцію → наступний удар як у голову"]},"syn":[{"t":"S1","w":"B3","x":{"en":"Head Thrust: up to +120% for retreating.","ru":"Укол в голову: до +120% за отступление.","uk":"Укол у голову: до +120% за відступ."}}]},{"id":"H3","br":"H","row":1,"need":8,"max":1,"icon":"star","big":true,"name":{"en":"Spear Master","ru":"Мастер копья","uk":"Майстер списа"},"desc":{"en":"Big hybrid (8 points in each branch). A successful parry throws the zombie 3 m back and goes through everyone behind it, like a power hit.","ru":"Большой гибрид (8 очков в каждой ветке). Удачное парирование отбрасывает зомби на 3 м и пробивает всех за ним, как силовой удар.","uk":"Великий гібрид (≥8 очок у кожній гілці). Вдале парирування відкидає зомбі на 3 м і пробиває всіх за ним, як силовий удар."},"ranks":{"en":["Parry = a power hit: thrown 3 m and the line pierced"],"ru":["Парирование = силовой удар: отброс 3 м и пробитие линии"],"uk":["Парирування = силовий удар: відкидання 3 м і пробиття лінії"]},"syn":[{"t":"S1","w":"A5","x":{"en":"Tip in the Wound: a parry as a power hit leaves the tip in the target.","ru":"Остриё в ране: парирование как силовой удар оставляет остриё в цели.","uk":"Вістря в рані: парирування як силовий удар лишає вістря в цілі."}}]}],"presets":[{"n":{"en":"Battering Ram (A18 + B7)","ru":"Таран (A18 + B7)","uk":"Таран (A18 + B7)"},"r":{"A1":3,"A2":3,"A3":3,"A4":3,"A5":1,"A6":2,"A7":2,"A8":1,"B1":3,"B2":3,"B3":1}},{"n":{"en":"Fencer (B18 + A7)","ru":"Фехтовальщик (B18 + A7)","uk":"Фехтувальник (B18 + A7)"},"r":{"B1":3,"B2":3,"B3":3,"B4":3,"B5":1,"B6":2,"B7":2,"B8":1,"A1":3,"A2":3,"A3":1}},{"n":{"en":"Hybrid (11 + 11 + 3)","ru":"Гибрид (11 + 11 + 3)","uk":"Гібрид (11 + 11 + 3)"},"r":{"A1":3,"A2":2,"A3":2,"A4":2,"A5":1,"A6":1,"B1":3,"B2":2,"B3":2,"B4":2,"B5":1,"B6":1,"H1":1,"H2":1,"H3":1}}]},"knuckles":{"key":"Knuckles","name":{"en":"Knuckles","ru":"Кастеты","uk":"Кастети"},"base":{"icon":"duel","name":{"en":"Counter Punch","ru":"Контрудар","uk":"Контрудар"},"desc":{"en":"Every hit you take gives a charge (max 2, no timer). A normal hit spends 1 charge and deals +25%; a power hit spends all, +50% per charge, and knocks down. Branch A is the tank: they hit you, you hit back; branch B the opposite: a combo while nothing hits you.","ru":"Каждый полученный удар даёт заряд (максимум 2, без таймера). Обычный удар тратит 1 заряд и бьёт +25%; силовой тратит все, +50% за каждый, и сбивает с ног. Ветка A — танк: вас бьют, вы отвечаете; ветка B — наоборот: серия, пока вас не задели.","uk":"Кожен отриманий удар дає заряд (максимум 2, без таймера). Звичайний удар витрачає 1 заряд і б'є +25%; силовий витрачає всі, +50% за кожен, і збиває з ніг. Гілка A — танк: вас б'ють, ви відповідаєте; гілка B — навпаки: серія, поки вас не зачепили."}},"br":{"A":{"name":{"en":"Counter Punch","ru":"Контрудар","uk":"Контрудар"},"idea":{"en":"Tank: more charges, less damage while charged, recoil to the attacker, healing and \"blood for blood\".","ru":"Танк: больше зарядов, меньше урона, пока заряжены, отдача нападающему, лечение и «кровь за кровь».","uk":"Танк: більше зарядів, менше шкоди, поки заряджені, віддача нападнику, лікування і «кров за кров»."}},"B":{"name":{"en":"Flurry","ru":"Шквал","uk":"Шквал"},"idea":{"en":"You are not hit: the streak grows while you let nothing through — speed, evasion, the first hit, a hundred fists.","ru":"Вас не бьют: серия ударов растёт, пока вы ничего не пропустили — скорость, уклонение, первый удар, сто кулаков.","uk":"Вас не б'ють: серія ударів росте, поки ви нічого не пропустили — швидкість, ухилення, перший удар, сто кулаків."}}},"attr":{"en":"Fortitude","ru":"Стойкость","uk":"Стійкість"},"external":{},"skills":[{"id":"A1","br":"A","tier":1,"col":0,"max":3,"icon":"bullets","name":{"en":"More Charges","ru":"Больше зарядов","uk":"Більше зарядів"},"desc":{"en":"Max Counter Punch charges (2 by default).","ru":"Максимум зарядов Контрудара (по умолчанию 2).","uk":"Максимум зарядів Контрудару (базово 2)."},"ranks":{"en":["3","4","7"],"ru":["3","4","7"],"uk":["3","4","7"]},"syn":[]},{"id":"A2","br":"A","tier":1,"col":1,"max":3,"icon":"steady","name":{"en":"Iron Skin","ru":"Железная кожа","uk":"Залізна шкіра"},"desc":{"en":"While you have at least one charge you take less damage. Strength = rank x your Fortitude level. A power hit that spends them all leaves you without it until you are hit again.","ru":"Пока есть хоть один заряд, вы получаете меньше урона. Сила = ранг x уровень вашей Стойкости. Потратили все силовым — защиты нет, пока снова не ударят.","uk":"Поки у вас є хоч один заряд, ви отримуєте менше шкоди. Залежить від атрибута Стійкість: ранг × рівень Стійкості. Витратили всі заряди силовим — захисту немає, доки знову не вдарять."},"ranks":{"en":["-1% x Fortitude (max -10%)","-2% x Fortitude (max -20%)","-4% x Fortitude (max -40%)"],"ru":["-1% x Стойкость (до -10%)","-2% x Стойкость (до -20%)","-4% x Стойкость (до -40%)"],"uk":["−1% × Стійкість (до −10%)","−2% × Стійкість (до −20%)","−4% × Стійкість (до −40%)"]},"syn":[{"t":"S2","w":null,"x":{"en":"Resonance: Fortitude matters for knuckles again.","ru":"Резонанс: Стойкость снова важна для кастетов.","uk":"Резонанс: Стійкість знову важить для кастетів."}}]},{"id":"A3","br":"A","tier":2,"col":0,"max":3,"icon":"muscle","name":{"en":"Retort","ru":"Ответ","uk":"Відповідь"},"desc":{"en":"A normal hit with a charge hits harder (+25% by default).","ru":"Обычный удар с зарядом бьёт сильнее (по умолчанию +25%).","uk":"Звичайний удар із зарядом б'є сильніше (базово +25%)."},"ranks":{"en":["+40%","+60%","+100%"],"ru":["+40%","+60%","+100%"],"uk":["+40%","+60%","+100%"]},"syn":[]},{"id":"A4","br":"A","tier":2,"col":1,"max":3,"icon":"refund","name":{"en":"Take It","ru":"Держи удар","uk":"Тримай удар"},"desc":{"en":"A hit you take may give 2 charges at once.","ru":"Полученный удар может дать сразу 2 заряда.","uk":"Отриманий удар може дати одразу 2 заряди."},"ranks":{"en":["15% chance","30% chance","60% chance"],"ru":["Шанс 15%","Шанс 30%","Шанс 60%"],"uk":["15% шанс","30% шанс","60% шанс"]},"syn":[]},{"id":"A5","br":"A","tier":3,"col":0,"max":1,"icon":"boot","notable":true,"name":{"en":"Recoil","ru":"Отдача","uk":"Віддача"},"desc":{"en":"If you are hit while your charges are full, the attacker is thrown back and stunned for 1 s.","ru":"Если вас бьют при полных зарядах, нападающего отбрасывает и оглушает на 1 с.","uk":"Якщо вас б'ють, коли заряди повні, нападника відкидає й оглушує на 1 с — рефлекторний удар у відповідь."},"ranks":{"en":["A hit on you at full charges: the attacker thrown back and stunned"],"ru":["Удар по вам при полных зарядах: нападающий отброшен и оглушён"],"uk":["Удар по вас на повних зарядах: нападник відкинутий і оглушений"]},"syn":[]},{"id":"A6","br":"A","tier":3,"col":1,"max":2,"icon":"drop","name":{"en":"Lick Wounds","ru":"Зализать раны","uk":"Зализати рани"},"desc":{"en":"A power hit that spends charges heals you.","ru":"Силовой удар, тратящий заряды, лечит вас.","uk":"Силовий удар, що витрачає заряди, лікує вас."},"ranks":{"en":["+3 HP per charge","+8 HP per charge"],"ru":["+3 HP за заряд","+8 HP за заряд"],"uk":["+3 HP за заряд","+8 HP за заряд"]},"syn":[]},{"id":"A7","br":"A","tier":4,"col":0,"span":2,"max":2,"icon":"blood","name":{"en":"Blood for Blood","ru":"Кровь за кровь","uk":"Кров за кров"},"desc":{"en":"The damage you took since your last power hit is added to the next power hit.","ru":"Урон, полученный после последнего силового удара, добавляется к следующему силовому.","uk":"Шкода, яку ви отримали після останнього силового удару, додається до наступного силового."},"ranks":{"en":["50% of the damage taken","150% of the damage taken"],"ru":["50% полученного урона","150% полученного урона"],"uk":["50% отриманої шкоди","150% отриманої шкоди"]},"syn":[]},{"id":"A8","br":"A","tier":5,"col":0,"span":2,"max":1,"icon":"star","cap":true,"name":{"en":"Knockout","ru":"Нокаут","uk":"Нокаут"},"desc":{"en":"Capstone. A power hit at full charges kills any non-elite zombie; an elite takes x3 and stays down 3 s. Downside: a heavy stance - for 15 s after it you move 20% slower.","ru":"Капстоун. Силовой удар на полных зарядах убивает любого не-элитного зомби, а элите наносит x3 и валит на 3 с. Минус: тяжёлая стойка — 15 с после такого удара вы двигаетесь на 20% медленнее.","uk":"Капстоун. Силовий удар на повних зарядах вбиває будь-якого не-елітного зомбі, а еліті завдає ×3 і валить на 3 с. Мінус: важка стійка — після такого удару 15 с ви рухаєтесь на 20% повільніше."},"ranks":{"en":["Power at full charges: non-elites at once, elites x3 and down 3 s; then 15 s -20% speed"],"ru":["Силовой на полных: не-элита сразу, элита x3 и лежит 3 с; потом 15 с -20% скорости"],"uk":["Силовий на повних: не-еліта одразу, еліта ×3 і лежить 3 с; після нього 15 с рух −20%"]},"syn":[{"t":"S6","w":"A1","x":{"en":"More Charges: for a full 7 you must take 7 hits — a risk for the sake of Knockout.","ru":"Больше зарядов: до полных 7 нужно пропустить 7 ударов — риск ради Нокаута.","uk":"Більше зарядів: до повних 7 треба пропустити 7 ударів — ризик заради Нокауту."}}],"breaks":[{"ids":["B2"],"lvl":"weak","why":{"en":"15 s after Knockout movement -20%: Light Feet is barely noticeable at that time.","ru":"15 с после Нокаута движение -20%: Лёгкие ноги в это время почти не ощутимы.","uk":"15 с після Нокауту рух −20%: Легкі ноги в цей час майже не відчутні."}}]},{"id":"B1","br":"B","tier":1,"col":0,"max":3,"icon":"chain","name":{"en":"Combo","ru":"Серия","uk":"Серія"},"desc":{"en":"Every hit of the combo, while nothing hits you, deals more (up to 10 hits). Get hit - the combo burns out.","ru":"Каждый удар серии, пока вас не задели, наносит больше (до 10 ударов). Пропустили удар — серия сгорает.","uk":"Кожен удар серії, поки вас не зачепили, дає більше шкоди (до 10 ударів). Пропустили удар — серія згоряє."},"ranks":{"en":["+2% per hit (max +20%)","+3% per hit (max +30%)","+6% per hit (max +60%)"],"ru":["+2% за удар (до +20%)","+3% за удар (до +30%)","+6% за удар (до +60%)"],"uk":["+2% за удар (до +20%)","+3% за удар (до +30%)","+6% за удар (до +60%)"]},"syn":[]},{"id":"B2","br":"B","tier":1,"col":1,"max":3,"icon":"boot","name":{"en":"Light Feet","ru":"Лёгкие ноги","uk":"Легкі ноги"},"desc":{"en":"In combat (5 s after a hit) you move faster - easier not to get hit.","ru":"В бою (5 с после удара) вы двигаетесь быстрее — легче не пропускать удары.","uk":"У бою (5 с після удару) ви рухаєтесь швидше — легше не пропускати удари."},"ranks":{"en":["+5%","+10%","+20%"],"ru":["+5%","+10%","+20%"],"uk":["+5%","+10%","+20%"]},"syn":[]},{"id":"B3","br":"B","tier":2,"col":0,"max":3,"icon":"bolt","name":{"en":"Fast Hands","ru":"Быстрые руки","uk":"Швидкі руки"},"desc":{"en":"Faster punches.","ru":"Быстрее удары.","uk":"Швидші удари."},"ranks":{"en":["+10%","+20%","+40%"],"ru":["+10%","+20%","+40%"],"uk":["+10%","+20%","+40%"]},"syn":[]},{"id":"B4","br":"B","tier":2,"col":1,"max":3,"icon":"eye","name":{"en":"Slip","ru":"Уклон","uk":"Ухил"},"desc":{"en":"From a 5-hit combo a zombie blow at you may miss - the combo stays.","ru":"От 5 ударов серии удар зомби по вам может промахнуться — серия не сгорает.","uk":"Від 5 ударів серії удар зомбі по вас може промахнутися — серія не згорає."},"ranks":{"en":["15% chance","25% chance","40% chance"],"ru":["Шанс 15%","Шанс 25%","Шанс 40%"],"uk":["15% шанс","25% шанс","40% шанс"]},"syn":[]},{"id":"B5","br":"B","tier":3,"col":0,"max":1,"icon":"wall","notable":true,"name":{"en":"Wall of Fists","ru":"Стена ударов","uk":"Стіна ударів"},"desc":{"en":"At a 10+ combo every punch cuts the target's swing: while you keep hitting it, it cannot hit back. Others around can.","ru":"На серии 10+ каждый ваш удар сбивает замах цели: пока вы бьёте её без остановки, она не успевает ответить. Другие вокруг — могут.","uk":"На серії 10+ кожен ваш удар збиває замах цілі: поки ви б'єте її без зупинки, вона не встигає вдарити у відповідь. Інші зомбі навколо — можуть."},"ranks":{"en":["Combo 10+: the target cannot attack while you hit"],"ru":["Серия 10+: цель не может атаковать, пока вы бьёте"],"uk":["Серія 10+: ціль не може атакувати, поки ви б'єте"]},"syn":[]},{"id":"B6","br":"B","tier":3,"col":1,"max":2,"icon":"target","na :{"en":"Live Wire","ru":"Удар по шокированному","uk":"Удар по шокованому"},"desc":{"en":"Normal and power hits on a shocked zombie hit harder. Shock first - then damage.","ru":"Обычные и силовые удары по шокированному зомби бьют сильнее. Сначала шок — потом урон.","uk":"Звичайні й силові удари по шокованому зомбі б'ють сильніше. Спершу шок — потім шкода."},"ranks":{"en":["+10%","+20%","+40%"],"ru":["+10%","+20%","+40%"],"uk":["+10%","+20%","+40%"]},"syn":[{"t":"S3","w":"E_SHOCK","x":{"en":"Also works on shock from the Tesla mod, Storm Fist, Thunderclap.","ru":"Действует и на шок от тесла-мода, Storm Fist, Thunderclap.","uk":"Діє й на шок від Tesla-моду, Storm Fist, Thunderclap."}}]},{"id":"B2","br":"B","tier":1,"col":1,"max":3,"icon":"timer","name":{"en":"Hold the Current","ru":"Держать под током","uk":"Тримати під струмом"},"desc":{"en":"The shock of a normal hit lasts longer (0.5 s by default) - the target stays shocked while you keep hitting.","ru":"Шок от обычного удара длится дольше (по умолчанию 0.5 с) — цель не выходит из-под шока, пока вы бьёте.","uk":"Шок від звичайного удару триває довше (базово 0.5 с) — ціль не виходить з-під шоку, поки ви б'єте."},"ranks":{"en":["+0.25 s","+0.5 s","+1 s (1.5 s)"],"ru":["+0.25 с","+0.5 с","+1 с (1.5 с)"],"uk":["+0.25 с","+0.5 с","+1 с (1.5 с)"]},"syn":[]},{"id":"B3","br":"B","tier":2,"col":0,"max":3,"icon":"target","name":{"en":"Breakdown","ru":"Пробой","uk":"Пробій"},"desc":{"en":"Every 4th normal hit in a row on the same zombie hits harder. Another target - the count starts again.","ru":"Каждый 4-й обычный удар подряд по тому же зомби бьёт сильнее. Сменили цель — счёт с нуля.","uk":"Кожен 4-й звичайний удар поспіль по тому самому зомбі б'є сильніше. Змінили ціль — лічильник з нуля."},"ranks":{"en":["+50%","+100%","+200%"],"ru":["+50%","+100%","+200%"],"uk":["+50%","+100%","+200%"]},"syn":[]},{"id":"B4","br":"B","tier":2,"col":1,"max":3,"icon":"eye","name":{"en":"Isolation","ru":"Изоляция","uk":"Ізоляція"},"desc":{"en":"When no other zombie is within 4 m of the target you hit harder - lure one away from the crowd.","ru":"Когда в 4 м от цели нет других зомби, вы бьёте сильнее — уводите одного от толпы.","uk":"Коли в 4 м від цілі немає інших зомбі, ви б'єте сильніше — відводьте одного від натовпу."},"ranks":{"en":["+15%","+30%","+50%"],"ru":["+15%","+30%","+50%"],"uk":["+15%","+30%","+50%"]},"syn":[]},{"id":"B5","br":"B","tier":3,"col":0,"max":1,"icon":"skull","notable":true,"name":{"en":"Cardiac Arrest","ru":"Остановка сердца","uk":"Зупинка серця"},"desc":{"en":"A shocked zombie at 25% health or less dies from your next hit. An elite does not die but takes +100%. Keep the target under current to the end.","ru":"Шокированный зомби с 25% здоровья или меньше умирает от следующего вашего удара. Элита не умирает, а получает +100%. Держите цель под током до конца.","uk":"Шокований зомбі з 25% здоров'я або менше помирає від наступного вашого удару. Еліта не помирає, а отримує +100%. Тримайте ціль під струмом до кінця."},"ranks":{"en":["Shocked at 25% HP or less: non-elites die, elites +100%"],"ru":["Шокированный с 25% HP: не-элита умирает, элита +100%"],"uk":["Шокований ≤25% HP: не-еліта помирає від удару, еліта +100%"]},"syn":[]},{"id":"B6","br":"B","tier":3,"col":1,"max":2,"icon":"chain","name":{"en":"Residual Charge","ru":"Остаточный заряд","uk":"Залишковий заряд"},"desc":{"en":"After a kill the Breakdown count does not reset: the next target starts with a few hits.","ru":"После убийства счёт Пробоя не обнуляется: следующая цель начинает с нескольких ударов.","uk":"Після вбивства лічильник Пробою не обнуляється: наступна ціль починає з кількох ударів."},"ranks":{"en":["From 1 hit","From 3 hits"],"ru":["С 1 удара","С 3 ударов"],"uk":["з 1 удару","з 3 ударів"]},"syn":[]},{"id":"B7","br":"B","tier":4,"col":0,"span":2,"max":2,"icon":"burst","name":{"en":"Discharge","ru":"Подрыв шока","uk":"Підрив шоку"},"desc":{"en":"A power hit on a shocked zombie \"detonates\" the shock: a bonus for every second left, the shock burns out. Shock with normal hits - finish with a power one.","ru":"Силовой удар по шокированному «подрывает» шок: бонус за каждую оставшуюся секунду, шок сгорает. Шокируйте обычными — добивайте силовым.","uk":"Силовий удар по шокованому зомбі «підриває» шок: бонус за кожну секунду, що лишилась, шок згорає. Шокуйте звичайними — добивайте силовим."},"ranks":{"en":["+25% per second of shock","+60% per second of shock"],"ru":["+25% за секунду шока","+60% за секунду шока"],"uk":["+25% за секунду шоку","+60% за секунду шоку"]},"syn":[]},{"id":"B8","br":"B","tier":5,"col":0,"span":2,"max":1,"icon":"star","cap":true,"name":{"en":"High Voltage","ru":"Высокое напряжение","uk":"Висока напруга"},"desc":{"en":"Capstone. A normal hit on a shocked zombie deals +100% and adds 0.5 s to its shock - while you keep hitting, the shock does not end. Downside: the mass stun radius is halved: 3 -> 1.5 m (with Wide Arc 5 -> 2.5 m).","ru":"Капстоун. Обычный удар по шокированному +100% и продлевает его шок на 0.5 с — пока вы не отпускаете цель, шок не кончается. Минус: радиус массового стана вдвое меньше: 3 -> 1.5 м (с Широким разрядом 5 -> 2.5 м).","uk":"Капстоун. Звичайний удар по шокованому зомбі б'є +100% і подовжує його шок на 0.5 с — поки ви не відпускаєте ціль, шок не закінчується. Мінус: радіус масового стану від силового удару вдвічі менший: 3 → 1.5 м (з Широким розрядом 5 → 2.5 м)."},"ranks":{"en":["Normal on shocked +100% and +0.5 s shock; mass stun radius x0.5"],"ru":["Обычный по шокированному +100% и +0.5 с шока; радиус массового стана x0.5"],"uk":["Звичайний по шокованому +100% і +0.5 с шоку; радіус масового стану ×0.5"]},"syn":[{"t":"S6","w":"B2","x":{"en":"Hold the Current: shock is long anyway — High Voltage keeps it from fading.","ru":"Держать под током: шок и так долгий — Высокое напряжение не даёт ему угаснуть.","uk":"Тримати під струмом: шок і так довгий — Висока напруга не дає йому згаснути."}}],"breaks":[{"ids":["A1","A5"],"lvl":"weak","why":{"en":"The radius of the mass state (and the cage field) is half as large.","ru":"Радиус массового состояния (и поля клетки) вдвое меньше.","uk":"Радіус масового стану (і поле клітки) вдвічі менший."}}]},{"id":"H1","br":"H","row":3,"need":5,"max":1,"icon":"ground","name":{"en":"Grounding","ru":"Заземление","uk":"Заземлення"},"desc":{"en":"Hybrid. Zombies shocked by you hit you 30% weaker - in a crowd and one on one.","ru":"Гибрид. Шокированные вами зомби бьют вас на 30% слабее — и в толпе, и один на один.","uk":"Гібрид. Шоковані вами зомбі б'ють вас на 30% слабше — і в натовпі, і сам на сам."},"ranks":{"en":["Hits of shocked zombies on you -30%"],"ru":["Удары шокированных зомби по вам -30%"],"uk":["Удари шокованих зомбі по вас −30%"]},"syn":[]},{"id":"H2","br":"H","row":4,"need":5,"max":1,"icon":"squad","name":{"en":"Technician","ru":"Технарь","uk":"Технар"},"desc":{"en":"Hybrid. Zombies shocked by your baton take +200% from your turrets and drone. An Intellect build: the baton holds, the turrets shoot.","ru":"Гибрид. Шокированные вашим жезлом получают +200% урона от ваших турелей и дрона. Билд на Интеллект: жезл держит, турели стреляют.","uk":"Гібрид. Зомбі, шоковані вашим кийком, отримують +200% шкоди від ваших турелей і дрона. Інтелект-білд: кийок тримає, турелі стріляють."},"ranks":{"en":["Shocked: +200% from your turrets and drone"],"ru":["Шокированные: +200% от ваших турелей и дрона"],"uk":["Шоковані: +200% від ваших турелей і дрона"]},"syn":[{"t":"S4","w":"X_TURRET","x":{"en":"Turrets (Robotic Turret, Robotic Sledge) and the drone — also Intellect.","ru":"Турели (Роботизированная пушка, Роботизированный молот) и дрон — тоже Интеллект.","uk":"Турелі (Junk Turret, Sledge Turret) і дрон — теж Інтелект."}}]},{"id":"H3","br":"H","row":1,"need":8,"max":1,"icon":"star","big":true,"name":{"en":"Tesla Coil","ru":"Катушка Теслы","uk":"Тесла-котушка"},"desc":{"en":"Big hybrid (8 points in each branch). Every Breakdown (the 4th hit on a target) fires the Chain Lightning without the cooldown - one target feeds the whole storm around.","ru":"Большой гибрид (8 очков в каждой ветке). Каждый Пробой (4-й удар по цели) запускает Цепную молнию без перезарядки — одна цель питает всю бурю вокруг.","uk":"Великий гібрид (≥8 очок у кожній гілці). Кожен Пробій (4-й удар по цілі) запускає Ланцюгову блискавку без перезарядки — одна ціль живить усю бурю навколо."},"ranks":{"en":["Breakdown fires the lightning without the cooldown"],"ru":["Пробой запускает молнию без перезарядки"],"uk":["Пробій запускає блискавку без перезарядки"]},"syn":[{"t":"S1","w":"B3","x":{"en":"Breakdown: the more often the 4th hit, the more often the lightning.","ru":"Пробой: чем чаще 4-й удар, тем чаще молния.","uk":"Пробій: що частіше 4-й удар, то частіше блискавка."}}]}],"presets":[{"n":{"en":"Storm (A18 + B7)","ru":"Буря (A18 + B7)","uk":"Буря (A18 + B7)"},"r":{"A1":3,"A2":3,"A3":3,"A4":3,"A5":1,"A6":2,"A7":2,"A8":1,"B1":3,"B2":3,"B3":1}},{"n":{"en":"Overload (B18 + A7)","ru":"Перегрузка (B18 + A7)","uk":"Перевантаження (B18 + A7)"},"r":{"B1":3,"B2":3,"B3":3,"B4":3,"B5":1,"B6":2,"B7":2,"B8":1,"A1":3,"A2":3,"A3":1}},{"n":{"en":"Hybrid (11 + 11 + 3)","ru":"Гибрид (11 + 11 + 3)","uk":"Гібрид (11 + 11 + 3)"},"r":{"A1":3,"A2":2,"A3":2,"A4":2,"A5":1,"A6":1,"B1":3,"B2":2,"B3":2,"B4":2,"B5":1,"B6":1,"H1":1,"H2":1,"H3":1}}]}}},"hud":{"png":{"ui_apos_acidarmor":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHLAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAeXSURBVHhe7d0tjB03EMDxwMDAwMDAwMDAwsDCkEqFBQVXFlYYUilSSWFgYFUUGBgYWNiyViWVIr1x5cYv2vtrP2Z3/TGe8w9Fp+fxeF7s/fDpfO/eMAzDMAzDMAzDMAxDJSGE+yLyYzjvCWOXEvti53ulMd9n7DtFRJ6KyEcW5wgRecv4pcS+2P8RceyxBozvXsZZT8VXgRyzn+7UapBz1lONVSDX7Cf3q0HBWU/FVoESs59crgYlZz2VXAVKzX5ysxpUnPWUfRWoMfup69Wg5qynEqtArdlP3a0GDWc9ZVsFWsx+6mI1aDnrKecq0Gr2k9nVwNCsp9OrgIXZT6ZWA0uznnKsAlZmPzVfDQzP+tM41jls00qT1cDyrM+B453DNi1VWw08z/orjnkJ21lQdDXwPusjjnkJ21lSbDUQkQ/szBuOeQnbWSMifzDn00IIN+zIE453CdtZJCKvmPdpIYSH7MgTjncJ21lU5BIQicg7duY :"Mark","ru":"Метка","uk":"Мітка"},"d":{"en":"A bolt marks the zombie for 10 s: all your damage to it (any weapon) +20%. Branch A grows the Mark (support for every weapon), branch B turns the bolt into a sticky charge that explodes.","ru":"Болт помечает зомби на 10 с: весь ваш урон по нему (любым оружием) +20%. Ветка A развивает Метку (поддержка всего оружия), ветка B делает из болта липкий заряд, который взрывается.","uk":"Болт позначає зомбі на 10 с: уся ваша шкода по ньому (будь-якою зброєю) +20%. Гілка A розвиває Мітку (підтримка всієї зброї), гілка B робить із болта липкий заряд, що вибухає."}},{"place":"z","icon":"run","color":"#73bfff","text":"-30%","k":"zombie|z|Замедление|-30%","what":{"uk":"Сповільнення: найсильніше з Кандалів пістолета й Раны лука (Подавление кулемета має свій значок).","en":"Slow: the strongest of the pistol Lead Shackles and the bow Hunter's Wound (the machine gun Suppression has its own icon).","ru":"Замедление: сильнейшее из «Свинцовых кандалов» пистолета и «Охотничьей раны» лука («Подавление» пулемёта имеет свой значок)."},"when":{"uk":"Поки діє.","en":"While it lasts.","ru":"Пока действует."},"name":{"en":"Slowed","ru":"Замедление","uk":"Замедление"},"src":{"uk":"Майстерність: Кандали пістолета (B4), Рана лука (B3), Шрапнельная рана лука (A6)","en":"Mastery: pistol Lead Shackles (B4), bow Hunter's Wound (B3), bow Shrapnel Wound (A6)","ru":"Мастерство: «Свинцовые кандалы» пистолета (B4), «Охотничья рана» лука (B3), «Шрапнельная рана» лука (A6)"}},{"place":"z","icon":"ui_apos_suppressed","color":"#73bfff","text":"-20%","k":"zombie|z|MG_Base|-20%","what":{"uk":"Подавление кулемета: наскільки зомбі сповільнений (до -20%).","en":"Machine gun Suppression: how slowed the zombie is (up to -20%).","ru":"«Подавление» пулемёта: насколько зомби замедлен (до -20%)."},"when":{"uk":"8 с після влучання з кулемета.","en":"8 s after a machine gun hit.","ru":"8 с после попадания из пулемёта."},"skill":{"cls":"mgs","id":"Base","br":null},"name":{"en":"Suppression","ru":"Подавление","uk":"Подавлення"},"d":{"en":"Every hit slows the zombie by 5% for 8 s, up to 20%. Every 4th hit puts a round back into the magazine. Branch A makes the suppression stronger, branch B the spin-up.","ru":"Каждое попадание замедляет зомби на 5% на 8 с, до 20%. Каждое 4-е попадание возвращает патрон в магазин. Ветка A усиливает подавление, ветка B — раскрутку.","uk":"Кожне влучання сповільнює зомбі на 5% на 8 с, до 20%. Кожне 4-те влучання повертає набій у магазин. Гілка A посилює подавлення, гілка B — розкрутку."}},{"place":"z","icon":"drop","color":"#ff594d","text":"x2","k":"zombie|z|Bows_B3|x2","what":{"uk":"Стаки Раны охотника.","en":"Hunter's Wound stacks.","ru":"Стаки «Охотничьей раны»."},"when":{"uk":"8 с.","en":"8 s.","ru":"8 с."},"skill":{"cls":"bows","id":"B3","br":"B"},"name":{"en":"Hunter's Wound","ru":"Охотничья рана","uk":"Мисливська рана"},"d":{"en":"A fully drawn hit leaves a wound for 8 s: the zombie takes more damage from all your attacks (any weapon) and moves slower. Up to 2 wounds.","ru":"Попадание полностью натянутой стрелой оставляет рану на 8 с: зомби получает больше урона от всех ваших атак (любым оружием) и медленнее двигается. До 2 ран.","uk":"Влучання повністю натягнутою стрілою залишає рану на 8 с: зомбі отримує більше шкоди від усіх ваших атак (будь-якою зброєю) і повільніше рухається. До 2 ран."}},{"place":"z","icon":"ui_apos_shattered","color":"#ff9933","text":"+50%","k":"zombie|z|Shotguns_A5|+50%","what":{"uk":"Разбитый: +50% від усього.","en":"Shattered: +50% from everything.","ru":"«Разбитый»: +50% от всего."},"when":{"uk":"Поки лежить і ще 3 с.","en":"While it lies and 3 s more.","ru":"Пока лежит и ещё 3 с."},"skill":{"cls":"shotguns","id":"A5","br":"A"},"name":{"en":"Shattered","ru":"Разбитый","uk":"Розбитий"},"d":{"en":"A zombie knocked down by a shotgun is Shattered (a red \"x1.5\" above it): while it lies and 3 s after it gets up, all damage to it is +50%, from anyone and any weapon.","ru":"Зомби, сбитый дробовиком, становится «Разбитым» (красное «x1.5» над ним): пока лежит и ещё 3 с после подъёма, весь урон по нему +50% — от кого угодно и любым оружием.","uk":"Зомбі, збитий дробовиком, стає «Розбитим» (червоне «x1.5» над ним): поки лежить і ще 3 с після підйому, уся шкода по ньому +50% — від будь-кого і будь-якою зброєю."}},{"place":"z","icon":"spear","color":"#ff8040","text":"+50%","k":"zombie|z|Spears_A5|+50%","what":{"uk":"Остриё в ране: бонус уколів.","en":"Tip in the Wound: thrust bonus.","ru":"«Остриё в ране»: бонус уколов."},"when":{"uk":"Після силового удару списом.","en":"After a spear power hit.","ru":"После силового удара копьём."},"skill":{"cls":"spears","id":"A5","br":"A"},"name":{"en":"Tip in the Wound","ru":"Остриё в ране","uk":"Вістря в рані"},"d":{"en":"After a power hit the tip stays in the first target: every next spear hit on it +25%, up to 4 times (+100%), while it lives. Finish the one with the tip in it.","ru":"После силового удара остриё остаётся в первой цели: каждый следующий удар копьём по ней +25%, до 4 раз (+100%), пока она жива. Добивайте ту, в которой остриё.","uk":"Після силового удару вістря лишається в першій цілі: кожен ваш наступний удар по ній (будь-яким ударом списа) +25%, до 4 разів (+100%), поки вона жива. Перемкнулись на іншого — бонус чекає на цій цілі, але ви його не отримуєте. Добивайте ту, в якій вістря."}},{"place":"z","icon":"ui_apos_armorbreak","color":"#cccccc","text":"-30%","k":"zombie|z|Sledges_B3|-30%","what":{"uk":"Ломка брони: знята броня.","en":"Armor Break: armor stripped.","ru":"«Ломка брони»: снятая броня."},"when":{"uk":"10 с.","en":"10 s.","ru":"10 с."},"skill":{"cls":"sledges","id":"B3","br":"B"},"name":{"en":"Armor Break","ru":"Ломка брони","uk":"Ламання броні"},"d":{"en":"A hit strips part of the zombie's armor for 10 s (vanilla armor: worker and biker 20%, soldier 50%, Demolisher 60%).","ru":"Удар снимает с зомби часть брони на 10 с (в ванили броня: рабочий и байкер 20%, солдат 50%, Разрушитель 60%).","uk":"Удар знімає з зомбі частину броні на 10 с (у ванілі броня: робітник і байкер 20%, солдат 50%, Demolisher 60%)."}},{"place":"z","icon":"concussion","color":"#ffe666","text":"+50%","k":"zombie|z|Clubs_A5|+50%","what":{"uk":"Контузія: +50% від усього.","en":"Concussion: +50% from everything.","ru":"«Сотрясение»: +50% от всего."},"when":{"uk":"Поки оглушений.","en":"While stunned.","ru":"Пока оглушён."},"skill":{"cls":"clubs","id":"A5","br":"A"},"name":{"en":"Concussion","ru":"Сотрясение","uk":"Струс мозку"},"d":{"en":"The stun lasts 2 s (instead of 1), and a stunned zombie takes +50% from everything - any weapon and element.","ru":"Оглушение длится 2 с (вместо 1), а оглушённый зомби получает +50% урона от всего — любого оружия и стихий.","uk":"Оглушення триває 2 с (замість 1), а оглушений зомбі отримує +50% шкоди від усього — будь-якої зброї і стихій."}},{"place":"z","icon":"fire","color":"#ff8019","text":"12s","k":"zombie|z|Горение|12s","what":{"uk":"Горіння: секунди, що лишились (з молотова, вогняної стріли, стихії).","en":"Burning: seconds left (from a Molotov, a fire arrow, an element).","ru":"Горение: секунды, что остались (от молотова, огненной стрелы, стихии)."},"when":{"uk":"Поки горить.","en":"While it burns.","ru":"Пока горит."},"name":{"en":"Burning","ru":"Горение","uk":"Горение"},"src":{"uk":"Молотов, вогняні стріли / болти, мод зброї «Вогонь», реакція Взрыв, Пылающая еліта","en":"Molotov, fire arrows / bolts, the \"Fire\" weapon mod, the Explosion reaction, Burning elite","ru":"Молотов, огненные стрелы / болты, мод оружия «Огонь», реакция «Взрыв», «Пылающая» элита"}},{"place":"z","icon":"critical","color":"#ff3333","text":"-8/s 14s","k":"zombie|z|Кровотечение|-8/s 14s","what":{"uk":"Кровотеча: шкода за секунду і секунди, що лишились.","en":"Bleeding: damage per second and seconds left.","ru":"Кровотечение: урон в секунду и секунды, что остались."},"when":{"uk":"Поки кровоточить.","en":"While it bleeds.","ru":"Пока кровоточит."},"name":{"en":"Bleeding","ru":"Кровотечение","uk":"Кровотечение"},"src":{"uk":"Силові удари ножа, Глубокие порезы, зазубрені стріли, Рваные раны дробовика, спис, кулемет (Разрыв), Миазмы, ванільні моди на кровотечу","en":"Knife power hits, Deep Cuts, barbed arrows, shotgun Ragged Wounds, spear, machine gun (Shred), Miasma, vanilla bleeding mods","ru":"Силовые удары ножа, «Глубокие порезы», зазубренные стрелы, «Рваные раны» дробовика, копьё, пулемёт («Разрыв»), «Миазмы», ванильные моды на кровотечение"}},{"place":"z","icon":"stunned","color":"#ff9919","text":"2s","k":"zombie|z|Оглушение|2s","what":{"uk":"Оглушення або збитий з ніг.","en":"Stunned or knocked down.","ru":"Оглушение или сбит с ног."},"when":{"uk":"Поки діє.","en":"While it lasts.","ru":"Пока действует."},"name":{"en":"Stunned","ru":"Оглушение","uk":"Оглушение"},"src":{"uk":"Хоумран дубинки, Землетрясение кувалди, Цепная молния кийка, Замешательство, ванільні оглушення","en":"Club Home Run, sledgehammer Earthquake, baton Chain Lightning, Confusion, vanilla stuns","ru":"«Хоумран» дубинки, «Землетрясение» кувалды, «Цепная молния» дубинки, «Замешательство», ванильные оглушения"}},{"place":"z","icon":"ui_apos_crippled","color":"#ff7373","text":"8s","k":"zombie|z|Покалечен|8s","what":{"uk":"Покалічені ноги.","en":"Crippled legs.","ru":"Покалеченные ноги."},"when":{"uk":"Поки діє.","en":"While it lasts.","ru":"Пока действует."},"name":{"en":"Crippled","ru":"Покалечен","uk":"Покалечен"},"src":{"uk":"Ванільні покалічені ноги (удари по ногах, перк «Громила Пит» тощо)","en":"Vanilla crippled legs (leg hits, the \"Pummel Pete\" perk, etc.)","ru":"Ванильные покалеченные ноги (удары по ногам, перк «Громила Пит» и т. п.)"}},{"place":"z","icon":"electric_power","color":"#66e6ff","text":"3s","k":"zombie|z|Шок|3s","what":{"uk":"Шок (стрілою, пасткою, кийком, модом «Ток»).","en":"Shock (from an arrow, a trap, a baton, the \"Shock\" mod).","ru":"Шок (стрелой, ловушкой, дубинкой, модом «Ток»)."},"when":{"uk":"Поки діє.","en":"While it lasts Полное натяжение","uk":"Повний натяг"},"d":{"en":"A fully drawn arrow hits harder. Strength = rank x your Agility level.","ru":"Полностью натянутая стрела бьёт сильнее. Сила = ранг x уровень вашей Ловкости.","uk":"Повністю натягнута стріла б'є сильніше. Сила = ранг x рівень вашої Ловкості."}},{"place":"alert","icon":"stealth","color":"#9999ff","text":"x2","kind":"next","mult":2.0,"k":"Bows|alert|Bows_B5|x2","what":{"uk":"Тень: тебе не помічають, наступна стріла ×2.","en":"Shadow: you go unnoticed, the next arrow x2.","ru":"«Тень»: тебя не замечают, следующая стрела ×2."},"when":{"uk":"5 с після тихого вбивства.","en":"5 s after a silent kill.","ru":"5 с после тихого убийства."},"skill":{"cls":"bows","id":"B5","br":"B"},"name":{"en":"Shadow","ru":"Тень","uk":"Тінь"},"d":{"en":"After a silent kill (the zombie did not see you) zombies do not notice you for 5 s, and the next arrow counts as from stealth (x2).","ru":"После тихого убийства (зомби вас не видел) 5 с вас не замечают, а следующая стрела считается из скрытности (x2).","uk":"Після тихого вбивства (зомбі вас не бачив) 5 с вас не помічають, а наступна стріла вважається зі скритності (x2)."}},{"place":"z","icon":"drop","color":"#ff594d","text":"x2","k":"Bows|z|Bows_B3|x2","what":{"uk":"Рана охотника: стаки рани (до 2), зомбі отримує більше шкоди й сповільнений.","en":"Hunter's Wound: wound stacks (up to 2), the zombie takes more damage and is slowed.","ru":"«Охотничья рана»: стаки раны (до 2), зомби получает больше урона и замедлен."},"when":{"uk":"8 с після влучання повністю натягнутою стрілою.","en":"8 s after a hit with a fully drawn arrow.","ru":"8 с после попадания полностью натянутой стрелой."},"skill":{"cls":"bows","id":"B3","br":"B"},"name":{"en":"Hunter's Wound","ru":"Охотничья рана","uk":"Мисливська рана"},"d":{"en":"A fully drawn hit leaves a wound for 8 s: the zombie takes more damage from all your attacks (any weapon) and moves slower. Up to 2 wounds.","ru":"Попадание полностью натянутой стрелой оставляет рану на 8 с: зомби получает больше урона от всех ваших атак (любым оружием) и медленнее двигается. До 2 ран.","uk":"Влучання повністю натягнутою стрілою залишає рану на 8 с: зомбі отримує більше шкоди від усіх ваших атак (будь-якою зброєю) і повільніше рухається. До 2 ран."}},{"place":"mark","icon":"ring","color":"#66d9ff","text":"","k":"Bows|mark|Bows_A7|ring","what":{"uk":"Блакитне пульсуюче кільце на стрілі в землі чи стіні: пастка заряджена.","en":"A blue pulsing ring on an arrow in the ground or a wall: the trap is armed.","ru":"Голубое пульсирующее кольцо на стреле в земле или стене: ловушка заряжена."},"when":{"uk":"Поки пастка чекає (до 10 с). Одна пастка за раз.","en":"While the trap waits (up to 10 s). One trap at a time.","ru":"Пока ловушка ждёт (до 10 с). Одна ловушка за раз."},"skill":{"cls":"bows","id":"A7","br":"A"},"name":{"en":"Shock Trap","ru":"Электроловушка","uk":"Електропастка"},"d":{"en":"An arrow that hits a zombie discharges electricity at once: everyone around is hit and shocked. An arrow in a wall or the ground is a trap: it waits up to 10 s and discharges when a zombie comes within 3 m (one trap at a time: a new one sets off the old one).","ru":"Стрела, попавшая в зомби, сразу бьёт током: все вокруг получают урон и шок. Стрела в стене или земле — ловушка: ждёт до 10 с и бьёт током, когда зомби подходит ближе 3 м (одна ловушка за раз: новая взрывает старую).","uk":"Стріла, що влучила в зомбі, одразу б'є струмом: усі навколо отримують шкоду й шок. Стріла в стіні або землі — пастка: чекає до 10 с і б'є струмом, коли зомбі підходить ближче 3 м (одна пастка за раз: нова підриває стару)."}},{"place":"feed","icon":"feed_pierce","color":"#ffd14d","text":"-45 ×3","k":"Bows|feed|Bows_B2|-45 ×3","what":{"uk":"Сквозная стрела: шкода кожному за ціллю і скільки зомбі прошито.","en":"Piercing Arrow: damage to each target behind and how many zombies were pierced.","ru":"«Сквозная стрела»: урон каждой цели позади и сколько зомби пробито."},"when":{"uk":"Коли повна стріла прошила когось у лінії.","en":"When a full arrow pierced someone in the line.","ru":"Когда полная стрела прошила кого-то в линии."},"skill":{"cls":"bows","id":"B2","br":"B"},"name":{"en":"Piercing Arrow","ru":"Сквозная стрела","uk":"Наскрізна стріла"},"d":{"en":"A fully drawn arrow goes through the zombie and hits those behind it in a line (up to 15 m further).","ru":"Полностью натянутая стрела прошивает зомби и бьёт тех, кто стоит за ним в линию (до 15 м дальше).","uk":"Повністю натягнута стріла прошиває зомбі і б'є тих, хто стоїть за ним у лінії (до 15 м далі)."}},{"place":"feed","icon":"feed_shock","color":"#59bfff","text":"-30 ×2","k":"Bows|feed|Bows_A7|-30 ×2","what":{"uk":"Электроловушка: шкода розряду і скільки зачепило.","en":"Shock Trap: discharge damage and how many were hit.","ru":"«Электроловушка»: урон разряда и сколько задело."},"when":{"uk":"Коли пастка або стріла в зомбі б'є струмом.","en":"When the trap or an arrow stuck in a zombie shocks.","ru":"Когда ловушка или стрела в зомби бьёт током."},"skill":{"cls":"bows","id":"A7","br":"A"},"name":{"en":"Shock Trap","ru":"Электроловушка","uk":"Електропастка"},"d":{"en":"An arrow that hits a zombie discharges electricity at once: everyone around is hit and shocked. An arrow in a wall or the ground is a trap: it waits up to 10 s and discharges when a zombie comes within 3 m (one trap at a time: a new one sets off the old one).","ru":"Стрела, попавшая в зомби, сразу бьёт током: все вокруг получают урон и шок. Стрела в стене или земле — ловушка: ждёт до 10 с и бьёт током, когда зомби подходит ближе 3 м (одна ловушка за раз: новая взрывает старую).","uk":"Стріла, що влучила в зомбі, одразу б'є струмом: усі навколо отримують шкоду й шок. Стріла в стіні або землі — пастка: чекає до 10 с і б'є струмом, коли зомбі підходить ближче 3 м (одна пастка за раз: нова підриває стару)."}}],"xbows":[{"place":"gR","icon":"traps","color":"#ff9933","text":"2/5","value":2,"seg":5,"k":"Crossbows|gR|Crossbows
