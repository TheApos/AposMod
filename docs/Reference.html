3 м."},"skill":{"cls":"sledges","id":"Base","br":null},"name":{"en":"Earthquake","ru":"Землетрясение","uk":"Землетрус"},"d":{"en":"A normal hit knocks the target down with a 20% chance; a power hit knocks down every zombie within 3 m and deals each 10% of its damage (10 s cooldown, power hits +50% stamina). Branch A grows the Earthquake (crowds), branch B the hit on one target.","ru":"Обычный удар с шансом 20% сбивает цель с ног; силовой сбивает всех зомби в 3 м и наносит каждому 10% своего урона (перезарядка 10 с, силовой +50% выносливости). Ветка A развивает Землетрясение (толпа), ветка B — удар по одной цели.","uk":"Звичайний удар із шансом 20% збиває ціль з ніг; силовий збиває всіх зомбі в 3 м і завдає кожному 10% своєї шкоди (перезарядка 10 с, силовий +50% витривалості). Гілка A розвиває Землетрус (натовп), гілка B — удар по одній цілі."}},{"place":"atk","icon":"twitch_strength_melee","color":"#66bfff","text":"x2","k":"Sledges|atk|Sledges_B4|x2","what":{"uk":"Размах: котрий удар поспіль по тому самому зомбі (до 3).","en":"Momentum: which hit in a row on the same zombie (up to 3).","ru":"«Размах»: какой удар подряд по тому же зомби (до 3)."},"when":{"uk":"3 с після удару. Таке саме число над цим зомбі.","en":"3 s after a hit. The same number is shown over this zombie.","ru":"3 с после удара. То же число над этим зомби."},"skill":{"cls":"sledges","id":"B4","br":"B"},"name":{"en":"Momentum","ru":"Размах","uk":"Розмах"},"d":{"en":"Every next hit on the same zombie hits harder (up to 3 in a row, resets after 3 s without a hit).","ru":"Каждый следующий удар по тому же зомби сильнее (до 3 подряд, сбрасывается через 3 с без удара).","uk":"Кожен наступний удар по тій самій цілі сильніший (до 3 поспіль, скидається через 3 с без удару)."}},{"place":"z","icon":"ui_apos_armorbreak","color":"#cccccc","text":"-30%","k":"Sledges|z|Sledges_B3|-30%","what":{"uk":"Ломка брони: скільки броні знято із зомбі.","en":"Armor Break: how much armor was stripped from the zombie.","ru":"«Ломка брони»: сколько брони снято с зомби."},"when":{"uk":"10 с після удару.","en":"10 s after a hit.","ru":"10 с после удара."},"skill":{"cls":"sledges","id":"B3","br":"B"},"name":{"en":"Armor Break","ru":"Ломка брони","uk":"Ламання броні"},"d":{"en":"A hit strips part of the zombie's armor for 10 s (vanilla armor: worker and biker 20%, soldier 50%, Demolisher 60%).","ru":"Удар снимает с зомби часть брони на 10 с (в ванили броня: рабочий и байкер 20%, солдат 50%, Разрушитель 60%).","uk":"Удар знімає з зомбі частину броні на 10 с (у ванілі броня: робітник і байкер 20%, солдат 50%, Demolisher 60%)."}}],"spears":[{"place":"gR","icon":"spear","color":"#66bfff","text":"x3","value":3,"seg":5,"k":"Spears|gR|Spears_B4|x3","what":{"uk":"Серия уколов по одній цілі (до 5).","en":"Thrust Chain: thrusts at one target (up to 5).","ru":"«Серия уколов» по одной цели (до 5)."},"when":{"uk":"Поки б'єш ту саму ціль з паузою ≤ 1 с. Те саме число над зомбі.","en":"While you hit the same target with pauses of 1 s or less. The same number is shown over the zombie.","ru":"Пока бьёшь ту же цель с паузой ≤ 1 с. То же число над зомби."},"skill":{"cls":"spears","id":"B4","br":"B"},"name":{"en":"Thrust Chain","ru":"Серия уколов","uk":"Серія уколів"},"d":{"en":"Every next hit on the same zombie (no more than 1 s apart) hits harder, up to 5 times. Another target or a pause - the chain burns out.","ru":"Каждый следующий удар по той же цели (с паузой не больше 1 с) сильнее, до 5 раз. Другая цель или пауза — серия сгорает.","uk":"Кожен наступний удар по тій самій цілі (з паузою не довше 1 с) сильніший, до 5 разів. Перемкнулись на іншу ціль або зупинились — серія згоряє."}},{"place":"spd","icon":"speed","color":"#ffd14d","text":"+50%  x2","kind":"attack","pct":50,"k":"Spears|spd|Spears_B7|+50%  x2","what":{"uk":"Контрвыпад: уколи на 50% швидші; x2 — скільки таких уколів лишилось.","en":"Riposte: thrusts are 50% faster; x2 is how many such thrusts are left.","ru":"«Контрвыпад»: уколы на 50% быстрее; x2 — сколько таких уколов осталось."},"when":{"uk":"Після вдалого парирування.","en":"After a successful parry.","ru":"После удачного парирования."},"skill":{"cls":"spears","id":"B7","br":"B"},"name":{"en":"Riposte","ru":"Контрвыпад","uk":"Контрвипад"},"d":{"en":"After a successful parry the next thrusts are 50% faster.","ru":"После удачного парирования следующие уколы на 50% быстрее.","uk":"Після вдалого парирування наступні уколи на 50% швидші."}},{"place":"alert","icon":"head_shot","color":"#ffd14d","text":"x1.8","kind":"next","mult":1.8,"k":"Spears|alert|Spears_H2|x1.8","what":{"uk":"Удар на отходе готовий: наступний удар ×1.5 і рахується як укол у голову, тож додається ще бонус Удара в голову (B3: +30 / 60 / 120%). Тут приклад із B3 на 1 ранзі: ×1.8. Зливається з іншими бонусами наступного удару.","en":"Parting Shot ready: the next hit x1.5 and counts as a head thrust, so the Head Thrust bonus (B3: +30 / 60 / 120%) is added too. This is an example with B3 at rank 1: x1.8. Merges with other next-hit bonuses.","ru":"«Удар на отходе» готов: следующий удар ×1.5 и считается уколом в голову, так что добавляется ещё бонус «Укола в голову» (B3: +30 / 60 / 120%). Здесь пример с B3 на 1 ранге: ×1.8. Сливается с другими бонусами следующего удара."},"when":{"uk":"Після того як відійшов на 2.5 м після удару.","en":"After you stepped 2.5 m away following a hit.","ru":"После того как отошёл на 2.5 м после удара."},"skill":{"cls":"spears","id":"H2","br":"H"},"name":{"en":"Parting Shot","ru":"Удар на отходе","uk":"Удар на відході"},"d":{"en":"Hybrid. The first hit after Hit and Back (when you stepped 2.5 m away) counts as a head thrust.","ru":"Гибрид. Первый удар после «Удара и отхода» (когда вы отошли на 2.5 м) считается уколом в голову.","uk":"Гібрид. Перший удар після «Удару і відходу» (коли ви встигли відійти на 2.5 м) рахується уколом у голову."}},{"place":"spd","icon":"ui_apos_speed","color":"#5ae68c","text":"+15%  2s","kind":"move","pct":15,"k":"Spears|spd|Spears_A6|+15%  2s","what":{"uk":"Удар и отход: наскільки ти швидший і скільки секунд лишилось.","en":"Hit and Back: how much faster you are and seconds left.","ru":"«Удар и отход»: насколько ты быстрее и сколько секунд осталось."},"when":{"uk":"2 с після удару списом.","en":"2 s after a spear hit.","ru":"2 с после удара копьём."},"skill":{"cls":"spears","id":"A6","br":"A"},"name":{"en":"Hit and Back","ru":"Удар и отход","uk":"Удар і відхід"},"d":{"en":"For 2 s after your hit you move faster - time to step back to spear distance.","ru":"2 с после вашего удара вы двигаетесь быстрее — успеть отступить на дистанцию копья.","uk":"Після вашого удару 2 с ви рухаєтесь швидше — встигнути відступити на дистанцію списа."}},{"place":"def","icon":"defense","color":"#b3d9ff","text":"OK","k":"Spears|def|Spears_A7|OK","what":{"uk":"Часовой: готовий автоукол (або секунди до готовності).","en":"Sentry: the auto-thrust is ready (or seconds until it is ready).","ru":"«Часовой»: автоукол готов (или секунды до готовности)."},"when":{"uk":"Завжди з навичкою A7.","en":"Always with skill A7.","ru":"Всегда с навыком A7."},"skill":{"cls":"spears","id":"A7","br":"A"},"name":{"en":"Sentry","ru":"Часовой","uk":"Вартовий"},"d":{"en":"A zombie that comes closer than 2 m gets a thrust by itself (normal damage and a push) - the spear keeps the distance for you.","ru":"Зомби, подошедший ближе 2 м, сам получает укол (обычный урон и толчок) — копьё держит дистанцию за вас.","uk":"Зомбі, що підходить ближче 2 м, сам отримує укол (звичайна шкода й поштовх) — спис тримає дистанцію за вас."}},{"place":"z","icon":"spear","color":"#ff8040","text":"+50%","k":"Spears|z|Spears_A5|+50%","what":{"uk":"Остриё в ране: бонус наступних уколів по цьому зомбі (+25% за удар, до +100%).","en":"Tip in the Wound: bonus of the next thrusts on this zombie (+25% per hit, up to +100%).","ru":"«Остриё в ране»: бонус следующих уколов по этому зомби (+25% за удар, до +100%)."},"when":{"uk":"Після силового удару по першій цілі.","en":"After a power hit on the first target.","ru":"После силового удара по первой цели."},"skill":{"cls":"spears","id":"A5","br":"A"},"name":{"en":"Tip in the Wound","ru":"Остриё в ране","uk":"Вістря в рані"},"d":{"en":"After a power hit the tip stays in the first target: every next spear hit on it +25%, up to 4 times (+100%), while it lives. Finish the one with the tip in it.","ru":"После силового удара остриё остаётся в первой цели: каждый следующий удар копьём по ней +25%, до 4 раз (+100%), пока она жива. Добивайте ту, в которой остриё.","uk":"Після силового удару вістря лишається в першій цілі: кожен ваш наступний удар по ній (будь-яким ударом списа) +25%, до 4 разів (+100%), поки вона жива. Перемкнулись на іншого — бонус чекає на цій цілі, але ви його не отримуєте. Добивайте ту, в якій вістря."}},{"place":"toast","icon":"","color":"#ffd966","text":"Парирование!","k":"Spears|toast|Spears_B5|Парирование!","what":{"uk":"Напис під прицілом + дзвін металу.","en":"A text under the crosshair + a metal ring.","ru":"Надпись под прицелом + звон металла."},"when":{"uk":"Удар по зомбі в момент його замаху.","en":"A hit on a zombie at the moment of its swing.","ru":"Удар по зомби в момент его замаха."},"skill":{"cls":"spears","id":"B5","br":"B"},"name":{"en":"Parry","ru":"Парирование","uk":"Парирування"},"d":{"en":"A hit on a zombie that is just swinging at you (a moment before its blow) interrupts its attack and deals x2. Catch the moment.","ru":"Удар по зомби, который как раз замахивается на вас (за миг до его удара), прерывает его атаку и бьёт x2. Ловите момент.","uk":"Удар по зомбі, який саме замахується на вас (за мить до його удару), перериває його атаку і б'є ×2. Треба ловити момент."}},{"place":"toast","icon":"","color":"#ffd14d","text":"Прорыв!","k":"Spears|toast|Spears_A8|Прорыв!","what":{"uk":"Напис під прицілом + важкий звук, спалах і рядок у стрічці.","en":"A text under the crosshair + a heavy sound, a flash and a line in the feed.","ru":"Надпись под прицелом + тяжёлый звук, вспышка и строка в ленте."},"when":{"uk":"Силовий удар одразу після бігу.","en":"A power hit right after sprinting.","ru":"Силовой удар сразу после бега."},"skill":{"cls":"spears","id":"A8","br":"A"},"name":{"en":"Breakthrough","ru":"Прорыв","uk":"Прорив"},"d":{"en":"Capstone. A power hit while running forward becomes a dash: you fly 6 m through the crowd, and everyone on the way is pierced, knocked down and takes x2. Downside: for 1.5 s after the dash you can barely attack.","ru":"Капстоун. Силовой удар на бегу вперёд становится рывком: вы пролетаете 6 м сквозь толпу, и каждый на пути пробит, сбит с ног и получает x2. Минус: 1.5 с после рывка вы почти не можете атаковать.","uk":"Капстоун. Силовий удар на бігу вперед стає ривком: ви пролітаєте 6 м крізь натовп, і кожен на шляху пробитий, збитий з ніг і отримує ×2 шкоди. Мінус: після ривка 1.5 с ви не можете атакувати — ви посеред натовпу, тож обирайте, куди прориватися."}}],"knuckles":[{"place":"def","icon":"boxer","color":"#ff9933","text":"1/2","k":"Knuckles|def|Knuckles_Base|1/2","what":{"uk":"Заряди Контрудара (від пропущених ударів): скільки є / максимум.","en":"Counter Punch charges (from hits you took): current / maximum.","ru":"Заряды «Контрудара» (от пропущенных ударов): сколько есть / максимум."},"when":{"uk":"Завжди з кастетами; сірий без зарядів, яскравий, коли повні.","en":"Always with knuckles; grey with no charges, bright when full.","ru":"Всегда с кастетами; серый без зарядов, яркий, когда полные."},"skill":{"cls":"knuckles","id":"Base","br":null},"name":{"en":"Counter Punch","ru":"Контрудар","uk":"Контрудар"},"d":{"en":"Every hit you take gives a charge (max 2, no timer). A normal hit spends 1 charge and deals +25%; a power hit spends all, +50% per charge, and knocks down. Branch A is the tank: they hit you, you hit back; branch B the opposite: a combo while nothing hits you.","ru":"Каждый полученный удар даёт заряд (максимум 2, без таймера). Обычный удар тратит 1 заряд и бьёт +25%; силовой тратит все, +50% за каждый, и сбивает с ног. Ветка A — танк: вас бьют, вы отвечаете; ветка B — наоборот: серия, пока вас не задели.","uk":"Кожен отриманий удар дає заряд (максимум 2, без таймера). Звичайний удар витрачає 1 заряд і б'є +25%; силовий витрачає всі, +50% за кожен, і збиває з ніг. Гілка A — танк: вас б'ють, ви відповідаєте; гілка B — навпаки: серія, поки вас не зачепили."}},{"place":"spd","icon":"ui_apos_speed","color":"#5ae68c","text":"+10%","kind":"move","pct":10,"k":"Knuckles|spd|Knuckles_B2|+10%","what":{"uk":"Лёгкие ноги: наскільки ти швидший після удару.","en":"Light Feet: how much faster you are after a hit.","ru":"«Лёгкие ноги»: насколько ты быстрее после удара."},"when":{"uk":"5 с після удару кастетами.","en":"5 s after a knuckle hit.","ru":"5 с после удара кастетами."},"skill":{"cls":"knuckles","id":"B2","br":"B"},"name":{"en":"Light Feet","ru":"Лёгкие ноги","uk":"Легкі ноги"},"d":{"en":"In combat (5 s after a hit) you move faster - easier not to get hit.","ru":"В бою (5 с после удара) вы двигаетесь быстрее — легче не пропускать удары.","uk":"У бою (5 с після удару) ви рухаєтесь швидше — легше не пропускати удари."}},{"place":"spd","icon":"ui_apos_speed","color":"#ff6659","text":"-20%","kind":"move","pct":-20,"k":"Knuckles|spd|Knuckles_A8|-20%","what":{"uk":"Нокаут: мінус до твоєї швидкості (ціна капстоуна).","en":"Knockout: a minus to your speed (the price of the capstone).","ru":"«Нокаут»: минус к твоей скорости (цена капстоуна)."},"when":{"uk":"15 с після нокауту.","en":"15 s after a knockout.","ru":"15 с после нокаута."},"skill":{"cls":"knuckles","id":"A8","br":"A"},"name":{"en":"Knockout","ru":"Нокаут","uk":"Нокаут"},"d":{"en":"Capstone. A power hit at full charges kills any non-elite zombie; an elite takes x3 and stays down 3 s. Downside: a heavy stance - for 15 s after it you move 20% slower.","ru":"Капстоун. Силовой удар на полных зарядах убивает любого не-элитного зомби, а элите наносит x3 и валит на 3 с. Минус: тяжёлая стойка — 15 с после такого удара вы двигаетесь на 20% медленнее.","uk":"Капстоун. Силовий удар на повних зарядах вбиває будь-якого не-елітного зомбі, а еліті завдає ×3 і валить на 3 с. Мінус: важка стійка — після такого удару 15 с ви рухаєтесь на 20% повільніше."}},{"place":"def","icon":"defense","color":"#ff9933","text":"-12%","k":"Knuckles|def|Knuckles_A2|-12%","what":{"uk":"Железная кожа: наскільки менше шкоди ти отримуєш.","en":"Iron Skin: how much less damage you take.","ru":"«Железная кожа»: насколько меньше урона ты получаешь."},"when":{"uk":"Поки є хоч один заряд.","en":"While you have at least one charge.","ru":"Пока есть хоть один заряд."},"skill":{"cls":"knuckles","id":"A2","br":"A"},"name":{"en":"Iron Skin","ru":"Железная кожа","uk":"Залізна шкіра"},"d":{"en":"While you have at least one charge you take less damage. Strength = rank x your Fortitude level. A power hit that spends them all leaves you without it until you are hit again.","ru":"Пока есть хоть один заряд, вы получаете меньше урона. Сила = ранг x уровень вашей Стойкости. Потратили все силовым — защиты нет, пока снова не ударят.","uk":"Поки у вас є хоч один заряд, ви отримуєте менше шкоди. Залежить від атрибута Стійкість: ранг × рівень Стійкості. Витратили всі заряди силовим — захисту немає, доки знову не вдарять."}},{"place":"atk","icon":"twitch_strength_melee","color":"#66bfff","text":"6/10","k":"Knuckles|atk|Knuckles_B1|6/10","what":{"uk":"Серия: котрий удар поспіль без пропущеного удару.","en":"Combo: which hit in a row without being hit yourself.","ru":"«Серия»: какой удар подряд без пропущенного удара."},"when":{"uk":"Поки тебе не вдарили. Те саме число над ціллю.","en":"While nobody hits you. The same number is shown over the target.","ru":"Пока тебя не ударили. То же число над целью."},"skill":{"cls":"knuckles","id":"B1","br":"B"},"name":{"en":"Combo","ru":"Серия","uk":"Серія"},"d":{"en":"Every hit of the combo, while nothing hits you, deals more (up to 10 hits). Get hit - the combo burns out.","ru":"Каждый удар серии, пока вас не задели, наносит больше (до 10 ударов). Пропустили удар — серия сгорает.","uk":"Кожен удар серії, поки вас не зачепили, дає більше шкоди (до 10 ударів). Пропустили удар — серія згоряє."}},{"place":"alert","icon":"bat","color":"#aa78ff","text":"x2","kind":"next","mult":2.0,"k":"Knuckles|alert|buffAposShadow|x2","what":{"uk":"Приклад злиття: Тень перка «Бесшумная тень» 5 теж дає ×2 наступному удару в ближньому бою. Разом із Первым ударом вони в одній плашці над прицілом, а множники перемножуються: ×2 · ×2 = ×4.","en":"Merge example: the Shadow of the \"From the Shadows\" 5 perk also gives x2 to the next melee hit. Together with Opener they sit in one pill above the crosshair, and the multipliers multiply: x2 · x2 = x4.","ru":"Пример слияния: «Тень» перка «Бесшумная тень» 5 тоже даёт ×2 следующему удару в ближнем бою. Вместе с «Первым ударом» они в одной плашке над прицелом, а множители перемножаются: ×2 · ×2 = ×4."},"when":{"uk":"Коли обидва бонуси готові одночасно.","en":"When both bonuses are ready at once.","ru":"Когда оба бонуса готовы одновременно."},"name":{"en":"Shadow","ru":"Тень","uk":"Тень"},"d":{"en":"Source: perk From The Shadows 5\\nYour next weapon hit deals x2. A kill with it gives the Shadow back. Lost when you stand up or a zombie notices you.","ru":"Источник: перк «Бесшумная тень» 5\\nСледующий удар оружием наносит x2. Убийство им возвращает Тень. Пропадает, если встать или вас заметили.","uk":"Источник: перк «Бесшумная тень» 5\\nСледующий удар оружием наносит x2. Убийство им возвращает Тень. Пропадает, если встать или вас заметили."},"src":{"uk":"Перк «Бесшумная тень» 5 (From The Shadows)","en":"Perk \"From the Shadows\" 5","ru":"Перк «Бесшумная тень» 5 (From The Shadows)"}},{"place":"alert","icon":"sneak_attack","color":"#ffd14d","text":"x2","full":true,"kind":"next","mult":2.0,"k":"Knuckles|alert|Knuckles_B6|x2","what":{"uk":"Первый удар: множник наступного удару.","en":"Opener: multiplier of the next hit.","ru":"«Первый удар     [/гнізд|гнезд|гнёзд|nest/i, 'feather'], [/цифр|damage number|aposdmg/i, 'target'],
    [/aposaffix|aposelite|aposbow|налашт|настрой|систем|system|setting/i, 'terminal'],
    [/баф|buff/i, 'skull'], [/запуск|launch/i, 'play'], [/ближній бій|ближний бой|melee/i, 'knife'], [/дальній бій|дальний бой|ranged/i, 'rifle']
  ];
  var tileMap = map.concat([
    [/здоров|лікув|леч|health|heal|hp\b/i, 'heart'], [/швидк|скорост|біг|бег|рух|speed|\brun|move/i, 'run'],
    [/торгов|trader|ціна|цен|price|знижк|скидк|discount|bartering/i, 'coin'], [/секунд|second|час|время|перезаряд|reload/i, 'clock'],
    [/відмичк|отмычк|lock|замок|сейф|safe/i, 'key'], [/руд|ore|копа|добич|добыч|mining|miner/i, 'pick'],
    [/шкод|урон|damage/i, 'target']
  ]);

  function icon(name) {
    var ns = 'http://www.w3.org/2000/svg';
    var s = document.createElementNS(ns, 'svg'); s.setAttribute('class', 'hi'); s.setAttribute('aria-hidden', 'true');
    var u = document.createElementNS(ns, 'use'); u.setAttribute('href', '#i-' + name); s.appendChild(u); return s;
  }
  function pick(text, fallback) {
    for (var i = 0; i < tileMap.length; i++) if (tileMap[i][0].test(text)) return tileMap[i][1];
    return fallback;
  }

  function setup() {
    // search
    var q = document.getElementById('q'), none = document.getElementById('none');
    var cards = Array.prototype.slice.call(app.querySelectorAll('.card, .dmg'));
    var secs = Array.prototype.slice.call(app.querySelectorAll('[data-sec]'));
    function apply() {
      var term = q.value.trim().toLowerCase();
      document.body.classList.toggle('searching', !!term);
      var shown = 0;
      cards.forEach(function (c) {
        var hit = !term || c.textContent.toLowerCase().indexOf(term) !== -1;
        c.classList.toggle('hide', !hit);
        if (hit) shown++;
      });
      secs.forEach(function (s) {
        var any = s.querySelector('.card:not(.hide), .dmg:not(.hide)');
        s.classList.toggle('hide', !!term && !any);
      });
      if (none) none.classList.toggle('hide', shown > 0);
    }
    if (q) q.addEventListener('input', apply);
    document.body.classList.remove('searching');

    app.querySelectorAll('h2, .card h3').forEach(function (h) {
      var t = h.textContent;
      for (var i = 0; i < map.length; i++) if (map[i][0].test(t)) { h.insertBefore(icon(map[i][1]), h.firstChild); return; }
    });

    // lists of named things (legendaries, sets, perks, affix stats) -> tile grid; full text on hover / tap
    app.querySelectorAll('.card > ul:not(.plain)').forEach(function (ul) {
      var items = Array.prototype.slice.call(ul.children);
      if (items.length < 4) return;
      var named = items.every(function (li) { var f = li.firstElementChild; return f && f.tagName === 'B' && li.textContent.trim().indexOf(f.textContent.trim()) === 0; });
      if (!named) return;
      var card = ul.closest('.card'), headUse = card.querySelector('h3 .hi use');
      var fallback = headUse ? headUse.getAttribute('href').slice(3) : 'star';
      var grid = document.createElement('div'); grid.className = 'tiles';
      items.forEach(function (li) {
        var label = li.firstElementChild.textContent.replace(/[:\s]+$/, '');
        var parts = label.split(/\s+[—→]\s+/), main = parts[parts.length - 1], sub = parts.length > 1 ? parts.slice(0, -1).join(' — ') : '';
        var tile = document.createElement('div'); tile.className = 'tile'; tile.tabIndex = 0;
        tile.appendChild(icon(pick(li.textContent, fallback)));
        var m = document.createElement('span'); m.className = 't-main'; m.textContent = main; tile.appendChild(m);
        if (sub) { var s = document.createElement('span'); s.className = 't-sub'; s.textContent = sub; tile.appendChild(s); }
        var code = li.querySelector('code');
        if (code && code.textContent.length <= 14) { var v = document.createElement('span'); v.className = 't-val'; v.textContent = code.textContent; tile.appendChild(v); }
        var pop = document.createElement('span'); pop.className = 'pop'; pop.setAttribute('role', 'tooltip');
        Array.prototype.forEach.call(li.childNodes, function (n) { pop.appendChild(n.cloneNode(true)); });
        tile.appendChild(pop);
        grid.appendChild(tile);
      });
      ul.parentNode.replaceChild(grid, ul);
    });

    // long bullets: keep the first sentence, the rest goes into a hover / tap hint (still searchable)
    var LIMIT = 80;
    app.querySelectorAll('.card li').forEach(function (li) {
      if (li.textContent.length <= LIMIT || li.querySelector('ul, .mi, table')) return;
      var walker = document.createTreeWalker(li, NodeFilter.SHOW_TEXT), node, seen = 0, cut = null;
      while ((node = walker.nextNode())) {
        var re = /[.;!?](\s)/g, r, txt = node.nodeValue;
        while ((r = re.exec(txt))) {
          if (seen + r.index >= 25 && node.parentNode === li) { cut = { node: node, at: r.index + 1 }; break; }
        }
        if (cut) break;
        seen += txt.length;
      }
      if (!cut || li.textContent.length - (seen + cut.at) < 20) return;
      var rest = cut.node.splitText(cut.at);
      var more = document.createElement('span'); more.className = 'more';
      while (rest) { var next = rest.nextSibling; more.appendChild(rest); rest = next; }
      li.appendChild(more);
      var dots = document.createElement('span'); dots.className = 'dots'; dots.textContent = 'i'; li.appendChild(dots);
      var pop = document.createElement('span'); pop.className = 'pop'; pop.setAttribute('role', 'tooltip');
      Array.prototype.forEach.call(li.childNodes, function (n) { if (n !== dots) pop.appendChild(n.cloneNode(true)); });
      pop.querySelectorAll('.more').forEach(function (x) { x.className = ''; });
      li.appendChild(pop);
      li.classList.add('tipped'); li.tabIndex = 0;
    });

    // keep tile hints inside the screen: shift sideways when they would cross an edge
    function fit(e) {
      var pop = e.currentTarget.querySelector('.pop'); if (!pop) return;
      pop.style.transform = 'translateX(-50%)';
      requestAnimationFrame(function () {
        var r = pop.getBoundingClientRect(), dx = 0, pad = 8;
        if (r.right > window.innerWidth - pad) dx = window.innerWidth - pad - r.right;
        if (r.left + dx < pad) dx = pad - r.left;
        pop.style.transform = 'translateX(calc(-50% + ' + Math.round(dx) + 'px))';
      });
    }
    app.querySelectorAll('.tile, .mil').forEach(function (t) { t.addEventListener('mouseenter', fit); t.addEventListener('focus', fit); });

    // language switch in the header line
    var meta = app.querySelector('.meta');
    if (meta) {
      var box = document.createElement('span'); box.className = 'langs'; box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Language');
      LANGS.forEach(function (l) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = l.toUpperCase();
        b.setAttribute('aria-pressed', l === current ? 'true' : 'false');
        b.addEventListener('click', function () { show(l); });
        box.appendChild(b);
      });
      meta.appendChild(box);
    }

    // height of the sticky top bar (0 when it is the fixed left column): the widgets' tab bars stick right under it
    var bar = app.querySelector('nav.bar');
    function navh() {
      var h = bar && getComputedStyle(bar).position === 'sticky' ? bar.offsetHeight : 0;
      document.documentElement.style.setProperty('--navh', h + 'px');
    }
    navh();
    if (!resizeHooked) { resizeHooked = true; window.addEventListener('resize', function () { navh2(); }); }
    navh2 = navh;

    // highlight the section being read in the section bar
    if (spy) spy.disconnect();
    if ('IntersectionObserver' in window) {
      var links = {};
      app.querySelectorAll('nav.bar a[href^="#"]').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
      spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (!en.isIntersecting || !links[en.target.id]) return;
          Object.keys(links).forEach(function (k) { links[k].classList.toggle('here', k === en.target.id); });
        });
      }, { rootMargin: '-30% 0px -60% 0px' });
      app.querySelectorAll('section[id]').forEach(function (s) { spy.observe(s); });
    }

    // the interactive sections (widgets.js): build them for this language
    if (window.AposWidgets) window.AposWidgets.mount(app, current);
  }

  var current = null, spy = null, resizeHooked = false, navh2 = function () { };
  function show(lang) {
    if (LANGS.indexOf(lang) < 0) lang = 'en';
    if (lang === current) return;
    var tpl = document.getElementById('lang-' + lang);
    current = lang;
    app.innerHTML = '';
    app.appendChild(tpl.content.cloneNode(true));
    document.documentElement.lang = lang;
    try { localStorage.setItem(KEY, lang); } catch (e) { }
    setup();
  }

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { }
  show(saved || 'en');
})();
</script>
