<style>
/* Layout: a field manual — one column of sections, cards in a wrapping grid, sticky section bar with search */
:root {
  --bg: #eceae4;
  --panel: #f8f7f3;
  --ink: #1f2124;
  --muted: #5d6066;
  --line: #cfccc3;
  --amber: #b86a00;
  --amber-soft: #f3e3c8;
  --rust: #a2361f;
  --gold: #a87800;
  --magenta: #b0129f;
  --f-display: "Russo One", "Arial Black", Impact, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --panel: #212326; --ink: #e9e6de; --muted: #a3a29c; --line: #34373b;
    --amber: #f0a43a; --amber-soft: #3a2c16; --rust: #e0694c; --gold: #f2c14e; --magenta: #ff5ae6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181a; --panel: #212326; --ink: #e9e6de; --muted: #a3a29c; --line: #34373b;
  --amber: #f0a43a; --amber-soft: #3a2c16; --rust: #e0694c; --gold: #f2c14e; --magenta: #ff5ae6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 28px 18px; border-bottom: 3px solid var(--amber); }
.stripe { height: 10px; background: repeating-linear-gradient(135deg, var(--amber) 0 14px, transparent 14px 28px); opacity: .85; margin-bottom: 18px; border-radius: 2px; }
h1 { font: 400 clamp(30px, 6vw, 48px)/1.05 var(--f-display); margin: 0; letter-spacing: .5px; text-wrap: balance; }
.sub { color: var(--muted); margin: 8px 0 0; max-width: 65ch; }
.meta { font: 600 12px var(--f-mono); color: var(--amber); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
nav.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.bar .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; }
nav.bar a { font: 600 13px var(--f-body); color: var(--ink); text-decoration: none; padding: 5px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
nav.bar a:hover, nav.bar a:focus-visible { border-color: var(--amber); outline: none; }
#q { flex: 1 1 200px; min-width: 0; font: 14px var(--f-body); padding: 7px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink); }
#q:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
section { padding-block: 26px 6px; }
h2 { font: 400 24px/1.2 var(--f-display); margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
h2 small { font: 500 13px var(--f-body); color: var(--muted); }
.lead { color: var(--muted); margin: 0 0 14px; max-width: 70ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 15px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.card h3 { font: 600 16px/1.3 var(--f-body); margin: 0; }
.card h3 .trait { color: var(--amber); }
.tagline { font: 500 12px var(--f-mono); color: var(--muted); letter-spacing: .3px; }
.card ul { margin: 0; padding-left: 18px; }
.card li { margin: 2px 0; }
.k { font: 600 11px var(--f-mono); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.five { border-top: 1px dashed var(--line); padding-top: 8px; }
.five b { color: var(--amber); }
.cost { font-size: 13px; color: var(--rust); }
.scale { overflow-x: auto; }
.scale table { border-collapse: collapse; font: 12.5px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 100%; }
.scale th, .scale td { border: 1px solid var(--line); padding: 3px 6px; text-align: center; white-space: nowrap; }
.scale th { background: var(--amber-soft); font-weight: 600; }
.scale td:first-child, .scale th:first-child { text-align: left; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.dmg { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
.num { font: 400 20px var(--f-display); min-width: 70px; text-align: center; text-shadow: 1px 1px 0 rgba(0,0,0,.6); background: #26282c; border-radius: 3px; padding: 2px 8px; }
.n-white { color: #ffffff; } .n-yellow { color: #ffd91a; } .n-cyan { color: #4dd9ff; } .n-red { color: #ff2a1a; }
.n-magenta { color: #ff3df2; } .n-green { color: #8cff2e; } .n-orange { color: #ff8c1a; } .n-blue { color: #4073ff; } .n-pink { color: #ff7380; }
code, .mono { font: 13px var(--f-mono); background: var(--amber-soft); padding: 1px 5px; border-radius: 3px; }
pre { font: 13px var(--f-mono); background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; border-radius: 4px; overflow-x: auto; margin: 0; }
.legendary h3 .trait { color: var(--gold); }
.reaction h3 .trait { color: var(--magenta); }
.empty { color: var(--muted); padding: 10px 0; }
footer { color: var(--muted); font-size: 13px; padding-block: 30px 40px; border-top: 1px solid var(--line); margin-top: 26px; }
.hide { display: none !important; }
@media (prefers-reduced-motion: no-preference) { nav.bar a { transition: border-color .15s; } }
.mi{display:inline-block;width:1.15em;height:1.15em;margin-right:.3em;vertical-align:-.2em;background:var(--c);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;filter:drop-shadow(0 0 1px rgba(0,0,0,.6))}
.milegend{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:8px}.mil{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:8px;background:rgba(0,0,0,.55)}.mil b{font-size:.85em;color:#fff}.mil small{font-size:.75em;color:#ccc}.mi.big{width:48px;height:48px;margin:0}
/* icons (stroke SVG sprite) and hover hints */
.hi { width: 1.15em; height: 1.15em; flex: none; stroke: var(--amber); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.18em; margin-right: .4em; }
h2 .hi { width: .95em; height: .95em; align-self: center; margin-right: 0; }
.card h3 { text-wrap: balance; }
.card h3 .hi { margin-top: .1em; }
li.tipped { position: relative; cursor: help; outline: none; }
li.tipped .more { display: none; }
li.tipped .dots { display: inline-flex; align-items: center; justify-content: center; width: 1.25em; height: 1.25em; margin-left: .3em; border-radius: 50%; border: 1px solid var(--amber); color: var(--amber); font: 600 11px var(--f-mono); vertical-align: .05em; }
li.tipped .pop { display: none; position: absolute; z-index: 6; left: -6px; right: -6px; top: calc(100% + 4px); background: var(--panel); color: var(--ink); border: 1px solid var(--amber); border-radius: 4px; padding: 8px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.28); font-size: 14px; }
li.tipped:hover .pop, li.tipped:focus .pop, li.tipped:focus-within .pop { display: block; }
li.tipped:focus-visible { box-shadow: 0 0 0 2px var(--amber); border-radius: 2px; }
.searching li.tipped .more { display: inline; }
.searching li.tipped .dots, .searching li.tipped .pop { display: none !important; }
[data-tip] { cursor: help; }
html, body { overflow-x: clip; }
.formula { display: flex; align-items: center; gap: 8px; font: 400 20px var(--f-display); color: var(--muted); }
.formula .el { display: inline-flex; width: 38px; height: 38px; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid currentColor; }
.formula .el .hi { margin: 0; width: 22px; height: 22px; stroke: currentColor; }
.formula .fire { color: #e8701a; } .formula .acid { color: #6cbf1f; } .formula .shock { color: #3c8dde; } .formula .res { color: var(--magenta); }
.mil { position: relative; cursor: help; outline: none; }
.mil:focus-visible { box-shadow: 0 0 0 2px var(--amber); }
.mil .pop, .tile .pop { display: none; visibility: visible; position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); top: calc(100% + 6px); width: min(280px, 80vw); text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--amber); border-radius: 4px; padding: 8px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.28); font: 14px/1.45 var(--f-body); }
.mil .pop b { color: var(--ink); font-size: 1em; }
.mil:hover .pop, .mil:focus .pop, .tile:hover .pop, .tile:focus .pop { display: block; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; padding: 10px 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: help; outline: none; min-width: 0; }
.tile:hover, .tile:focus-visible { border-color: var(--amber); }
.tile .hi { width: 26px; height: 26px; margin: 0; }
.tile .t-main { font: 600 13px/1.25 var(--f-body); overflow-wrap: anywhere; }
.tile .t-sub { font: 11px/1.25 var(--f-mono); color: var(--muted); overflow-wrap: anywhere; }
.tile .t-val { font: 600 11px var(--f-mono); color: var(--amber); }
.searching .tile .pop { display: block; position: static; transform: none; width: auto; box-shadow: none; border: 0; padding: 4px 0 0; background: none; }</style>

<section id="melee" data-sec>
  <h2>Melee <small>LMB — normal attack, RMB — power attack</small></h2>
  <p class="lead">A normal attack gives a small bonus, a power attack triggers the class's main trait.</p>
  <div class="grid">

    <article class="card">
      <h3>Knives &amp; machetes — <span class="trait">Bloodsucker</span></h3>
      <div class="tagline">Perk: Deep Cuts</div>
      <ul>
        <li>Each hit adds a regeneration stack (power attack — two): +1 HP/s per stack, each hit extends it to 5 s.</li>
        <li>A power attack causes bleeding.</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Max stacks</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr></table></div>
      <div class="five"><b>Level 5 — Blood Feast:</b> a knife kill at max stacks instantly heals 25 HP.</div>
    </article>

    <article class="card">
      <h3>Clubs &amp; bats — <span class="trait">Home Run</span></h3>
      <div class="tagline">Perk: Pummel Pete</div>
      <ul>
        <li>A normal attack can stun the target for 1 s.</li>
        <li>A power attack to the head launches the zombie and knocks it down.</li>
        <li>A power attack on a stunned target deals extra damage.</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Stun</td><td>15%</td><td>20%</td><td>25%</td><td>30%</td><td>35%</td><td>40%</td></tr><tr><td>Knockback force</td><td>800</td><td>950</td><td>1100</td><td>1250</td><td>1400</td><td>1550</td></tr><tr><td>Power vs stunned</td><td>—</td><td>+10%</td><td>+20%</td><td>+30%</td><td>+40%</td><td>+50%</td></tr></table></div>
      <div class="cost">Power attack costs 30% more stamina.</div>
      <div class="five"><b>Level 5:</b> Home Run triggers on a power attack to any body part, and <b>every 3rd normal attack</b> launches the zombie too.</div>
    </article>

    <article class="card">
      <h3>Sledgehammers — <span class="trait">Earthquake</span></h3>
      <div class="tagline">Perk: Skull Crusher</div>
      <ul>
        <li>A normal attack can knock the target down.</li>
        <li>A power attack knocks down every zombie around and damages each one.</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Knockdown (normal)</td><td>20%</td><td>25%</td><td>30%</td><td>35%</td><td>40%</td><td>45%</td></tr><tr><td>Radius</td><td>3 m</td><td>3.5</td><td>4</td><td>4.5</td><td>5</td><td>5.5</td></tr><tr><td>Damage to knocked down</td><td>—</td><td>10</td><td>20</td><td>30</td><td>40</td><td>50</td></tr></table></div>
      <div class="cost">4 s cooldown. Power attack costs 50% more stamina.</div>
      <div class="five"><b>Level 5 — Aftershock:</b> knocked-down zombies stay stunned for about 3 s after they get up.</div>
    </article>
    <article class="card">
      <h3>Clubs &amp; sledgehammers — <span class="trait">Rage</span></h3>
      <div class="tagline">Perk: Rage (replaces Grand Slam)</div>
      <ul>
        <li>A kill with a club, bat or sledgehammer gives a stack for 8 s: +10% damage, +5% attack speed.</li>
        <li>Max stacks equal the perk level (1–5).</li>
      </ul>
      <div class="five"><b>Level 5 — Rampage:</b> at 5 stacks attacks cost no stamina, and you can't be stunned or knocked down.</div>
    </article>

    <article class="card">
      <h3>Batons — <span class="trait">Chain Lightning</span></h3>
      <div class="tagline">Perk: Calculated Attack · batons and the pipe baton</div>
      <ul>
        <li>A normal attack briefly shocks the target.</li>
        <li>A power attack shocks every zombie around.</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Shock (normal)</td><td>0.5 s</td><td>0.6</td><td>0.7</td><td>0.8</td><td>0.9</td><td>1.0</td></tr><tr><td>Power radius</td><td>3 m</td><td>3.5</td><td>4</td><td>4.5</td><td>5</td><td>5.5</td></tr><tr><td>Shock (power)</td><td>2 s</td><td>2.4</td><td>2.8</td><td>3.2</td><td>3.6</td><td>4.0</td></tr></table></div>
      <div class="cost">3 s cooldown. Power attack costs 50% more stamina.</div>
      <div class="five"><b>Level 5:</b> every 4th normal attack also triggers Chain Lightning.</div>
    </article>

    <article class="card">
      <h3>Spears — <span class="trait">Battering Ram</span></h3>
      <div class="tagline">Perk: Spear Master</div>
      <ul>
        <li>A normal attack pushes the target back.</li>
        <li>A power attack pierces the zombies behind and knocks each one back.</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Power pierce</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr><tr><td>Push force</td><td>120</td><td>160</td><td>200</td><td>240</td><td>280</td><td>320</td></tr></table></div>
      <div class="five"><b>Level 5 — Skewer:</b> every zombie hit by a power attack is knocked down.</div>
    </article>

    <article class="card">
      <h3>Knuckles — <span class="trait">Counter Punch</span></h3>
      <div class="tagline">Perk: The Brawler</div>
      <ul>
        <li>Taking a hit fills charges. No timer.</li>
        <li>Normal attack: +25% damage, uses 1 charge; can grant a new charge.</li>
        <li>Power attack: uses all charges, +50% damage per charge, knocks down.</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Charges</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr><tr><td>Chance of +1 charge</td><td>—</td><td>10%</td><td>20%</td><td>30%</td><td>40%</td><td>50%</td></tr></table></div>
      <div class="five"><b>Level 5 — Knockout:</b> a power attack at full charges kills any non-elite zombie.</div>
    </article>


  </div>
</section>

<section id="ranged" data-sec>
  <h2>Ranged</h2>
  <p class="lead">Each trait grows with its weapon's perk.</p>
  <div class="grid">

    <article class="card">
      <h3>Pistols &amp; SMGs — <span class="trait">Headhunter</span></h3>
      <div class="tagline">Perk: Gunslinger</div>
      <ul>
        <li>5 headshots in a row (4 with the full Gunslinger set) activate empowered shots. A miss or a body hit resets the streak.</li>
        <li>Empowered shots hit harder with almost no spread.</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Shots</td><td>10</td><td>12</td><td>14</td><td>16</td><td>18</td><td>20</td></tr><tr><td>Damage</td><td>+25%</td><td>+35%</td><td>+45%</td><td>+55%</td><td>+65%</td><td>+75%</td></tr></table></div>
      <div class="five"><b>Level 5:</b> each <b>headshot</b> kill in this mode adds 2 more shots.</div>
    </article>
    <article class="card">
      <h3>Shotguns — <span class="trait">Slug Knockback</span></h3>
      <ul>
        <li>Slugs (Slug and Breaching Slug) knock the zombie back and down. Buckshot works as before.</li>
        <li>Breaching Slug only reaches 4 m — that's how the base game designed it.</li>
      </ul>
    </article>

    <article class="card">
      <h3>Rifles — <span class="trait">Ricochet</span></h3>
      <div class="tagline">Perk: Dead Eye</div>
      <ul><li>A headshot damages every zombie near the impact point.</li></ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Radius</td><td>5 m</td><td>7</td><td>9</td><td>11</td><td>13</td><td>15</td></tr><tr><td>Damage</td><td>20</td><td>30</td><td>40</td><td>50</td><td>60</td><td>70</td></tr></table></div>
      <div class="five"><b>Level 5:</b> the ricochet also stuns everyone it hits for 2 s.</div>
    </article>

    <article class="card">
      <h3>Assault rifles &amp; machine guns — <span class="trait">Suppression</span></h3>
      <div class="tagline">Perk: Machine Gunner</div>
      <ul>
        <li>Each hit slows the target by 5% for 8 s — up to the max in the table.</li>
        <li>Every 4th hit returns 1 round to the magazine (every 3rd with the full Commando set).</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Max slow</td><td>10%</td><td>20%</td><td>30%</td><td>40%</td><td>50%</td><td>60%</td></tr></table></div>
      <div class="five"><b>Level 5:</b> +25% damage to fully slowed targets, and each kill gives 5 rounds of the loaded ammo type.</div>
    </article>

    <article class="card">
      <h3>Bows — <span class="trait">Splinter</span></h3>
      <div class="tagline">Perk: Archery</div>
      <ul><li>An arrow shatters into splinters on hit. Each splinter flies at the nearest other zombie within 5 m.</li></ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Splinters</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>8</td></tr><tr><td>Splinter damage, minimum</td><td>40</td><td>50</td><td>60</td><td>70</td><td>80</td><td>100</td></tr></table></div>
      <ul><li>If the arrow hit harder, a splinter deals <b>half its damage</b> (up to 300).</li></ul>
      <div class="five"><b>Level 5:</b> an arrow to the head sets the target on fire.</div>
      <ul>
        <li><b>Controls:</b> the bow nocks the next arrow by itself while in hand. <b>R</b> opens the arrow wheel instantly with no delay: hold, aim, release.</li>
      </ul>
    </article>

    <article class="card">
      <h3>Special arrows</h3>
      <div class="tagline">Bows only · crafted in the backpack, 3 per craft</div>
      <ul>
        <li><b>Acid</b> (+1 rotting flesh): corrodes (−25% physical armor, acid damage every second) and <b>slows by 90%</b>. Duration by Archery: 5 s (0–1), 6 / 7 / 8 s (2 / 3 / 4), 10 s (5).</li>
        <li><b>Electric</b> (+1 electrical parts): shock for 4 s, damage per second scales with the hit.</li>
        <li><b>Barbed</b> (+1 forged steel): deep bleeding for 10 s, 15% of the hit per second (min. 12), plus normal bleeding. About 1.5 extra hits in total: shoot and keep your distance.</li>
        <li>Acid and shock trigger elemental reactions.</li>
      </ul>
    </article>

    <article class="card">
      <h3>Crossbows — <span class="trait">Mark · Pin</span></h3>
      <div class="tagline">Perk: Archery</div>
      <ul>
        <li><b>Mark:</b> a bolt marks the zombie for 10 s. All your damage to it, with any weapon, is increased. A red crosshair ring glows above the marked zombie, visible even through walls.</li>
        <li><b>Pin</b> (crossbows only, not bows): if there's a wall within 3 m behind the zombie, the bolt pins it until it dies. An elite — for 10 s.</li>
      </ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Mark bonus</td><td>+20%</td><td>+40%</td><td>+60%</td><td>+80%</td><td>+100%</td><td>+120%</td></tr></table></div>
      <div class="five"><b>Level 5 — Hunting Party:</b> a bolt marks every zombie within 4 m of the impact.</div>
    </article>


  </div>
</section>

<section id="elements" data-sec>
  <h2>Elements &amp; reactions</h2>
  <p class="lead">Three elements: fire, shock and acid. Two elements on one zombie trigger a reaction. After that the zombie has a 3 s reaction cooldown.</p>
  <div class="grid">
    <article class="card reaction">
      <h3>Fire + acid = <span class="trait">Explosion</span></h3><div class="formula" aria-hidden="true"><span class="el fire"><svg class="hi"><use href="#i-fire"/></svg></span>+<span class="el acid"><svg class="hi"><use href="#i-drop"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-bomb"/></svg></span></div>
      <ul><li>Explosion: 50% of your last hit's damage (at least 60) to the target and every zombie within 4 m. It doesn't hurt you.</li></ul>
    </article>
    <article class="card reaction">
      <h3>Fire + shock = <span class="trait">Confusion</span></h3><div class="formula" aria-hidden="true"><span class="el fire"><svg class="hi"><use href="#i-fire"/></svg></span>+<span class="el shock"><svg class="hi"><use href="#i-bolt"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-eye"/></svg></span></div>
      <ul><li>5 s: the zombie is 60% slower, takes more damage (−30 resistance) and is briefly stunned.</li></ul>
    </article>
    <article class="card reaction">
      <h3>Shock + acid = <span class="trait">Miasma</span></h3><div class="formula" aria-hidden="true"><span class="el shock"><svg class="hi"><use href="#i-bolt"/></svg></span>+<span class="el acid"><svg class="hi"><use href="#i-drop"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-flask"/></svg></span></div>
      <ul><li>6 s: the zombie's max health drops by 20%, and current health drops with it. Plus bleeding.</li></ul>
    </article>
    <article class="card">
      <h3>Where elements come from</h3>
      <ul>
        <li><b>Fire:</b> Incendiary mod, molotov, flaming arrows, Splinter at level 5, legendaries Dragon's Breath, Storm Fist, Artemis.</li>
        <li><b>Shock:</b> Tesla mod, batons (Chain Lightning), legendaries Thunderclap, Storm Fist.</li>
        <li><b>Acid:</b> Corrosive mod, legendary Hornet.</li><li><b>Bleeding</b> from your hits (knives, serrated blade, barbed wire, Ripper): 5% of the last hit's damage per second (at least 5).</li><li>The vanilla <b>Burning Shaft</b> mod now ignites with a 5–30% chance instead of 10–60%: its fire also scales with hit damage now.</li>
      </ul>
    </article>
  </div>
</section>

<section id="explosives" data-sec>
  <h2>Explosives, pipe weapons &amp; robots</h2>
  <div class="grid">
    <article class="card">
      <h3>Grenades — <span class="trait">Wide Blast</span></h3>
      <ul><li>Grenade, contact grenade and pipe bomb: radius of damage to zombies tripled. Block destruction is unchanged.</li></ul>
    </article>
    <article class="card">
      <h3>Molotov — <span class="trait">Busy Burning</span></h3>
      <ul><li>A burning zombie moves 70% slower and loses 4% of max health per second (at least 15) on top of normal fire.</li><li>The fire pool burns twice as long. Fire doesn't slow you.</li></ul>
    </article>
    <article class="card">
      <h3>Rocket launcher — <span class="trait">Early Artillery</span></h3>
      <ul><li>Sold by traders and found in loot from the start of the game.</li><li>The final loot chest can also hold the launcher itself: 6% at ★2, 10% at ★3, 15% at ★4, 20% at ★5.</li><li>Every POI's final loot chest has rockets:</li></ul>
      <div class="scale"><table><tr><th>Tier</th><th>★1</th><th>★2</th><th>★3</th><th>★4</th><th>★5</th></tr><tr><td>Rockets</td><td>1</td><td>1–2</td><td>2–3</td><td>3–4</td><td>4–6</td></tr></table></div>
    </article>
    <article class="card">
      <h3>Pipe weapons — <span class="trait">Veteran Junk</span></h3>
      <ul><li>Each pipe weapon kill: +2% damage to all pipe weapons, up to +1000%. The current bonus shows on the buff.</li><li>Repaired with scrap iron.</li></ul>
    </article>
    <article class="card">
      <h3>Robots — <span class="trait">Guardian Protocol</span></h3>
      <div class="tagline">Perk: Robotics Inventor · turret and robotic sledge</div>
      <ul><li>When your health is below 30%, robots attack faster and harder. An indicator buff appears.</li></ul>
      <div class="scale"><table><tr><th>Level</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Speed</td><td>+30%</td><td>+40%</td><td>+50%</td><td>+60%</td><td>+70%</td><td>+80%</td></tr><tr><td>Damage</td><td>+10%</td><td>+15%</td><td>+20%</td><td>+25%</td><td>+30%</td><td>+35%</td></tr></table></div>
      <div class="five"><b>Level 5:</b> kicks in already below 50% health.</div>
    </article>
  </div>
</section>

<section id="affixes" data-sec>
  <h2>Affixes</h2>
  <p class="lead">Weapons from loot, zombies and traders get random affixes — stat bonuses, like in Borderlands. Crafted weapons have none. The higher the quality, the more affixes and the stronger they are.</p>
  <div class="grid">
    <article class="card">
      <h3>How many affixes</h3>
      <ul>
        <li><b>Quality 1:</b> no affixes.</li>
        <li><b>Quality 2–3:</b> up to 1 (50% chance).</li>
        <li><b>Quality 4–5:</b> up to 2 (75% / 35%).</li>
        <li><b>Quality 6:</b> up to 3 (100% / 60% / 30%), values at max.</li>
        <li>A weapon never has the same affix twice. After combining two guns, extra affixes are removed.</li>
        <li>Affixes show at the top of the item tooltip, and the icon has a star badge.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Firearms, bows, rocket launcher</h3>
      <div class="tagline">Values: quality 2 → quality 6</div>
      <ul>
        <li><b>Fire rate</b> +5% → +25%</li>
        <li><b>Spread</b> −10% → −40%</li>
        <li><b>Range</b> +10% → +60%</li>
        <li><b>Damage</b> +5% → +35%</li>
        <li><b>Reload speed</b> +10% → +40%</li>
        <li><b>Pellets</b> (shotguns) +10% → +35%</li>
        <li><b>Second bullet</b> (pistols, rifles, assault rifles, quality 6 only): 2 bullets per shot, each −40% damage</li>
        <li><b>Headshot damage</b> +10% → +60%</li>
        <li><b>Magazine size</b> +10% → +60% (not on bows and crossbows)</li>
        <li><b>Movement speed</b> with the weapon in hand +2% → +10%</li>
        <li><b>Recoil</b> −10% → −50%</li>
      </ul>
    </article>
    <article class="card">
      <h3>Melee</h3>
      <div class="tagline">Values: quality 2 → quality 6</div>
      <ul>
        <li><b>Damage</b> +5% → +35%</li>
        <li><b>Attack speed</b> +4% → +20%</li>
        <li><b>Stamina per hit</b> −10% → −40%</li>
        <li><b>Headshot damage</b> +10% → +60%</li>
        <li><b>Attack range</b> +5% → +20%</li>
        <li><b>Movement speed</b> +2% → +10%</li>
        <li><b>Life steal</b> 1% → 6% of damage dealt</li>
        <li><b>Dismember chance</b> +5% → +30%</li>
        <li><b>Durability</b> +20% → +80%</li>
        <li><b>Block damage</b> +10% → +60%</li>
      </ul>
    </article>
  </div>
</section>

<section id="elites" data-sec>
  <h2>Elite zombies &amp; Eridium</h2>
  <p class="lead">Sometimes a zombie spawns as an elite: its name with modifiers floats above its head, like in Borderlands. It's tougher, but always drops a weapon with affixes and Eridium, and Eridium lets you perfect your gun.</p>
  <div class="grid">
    <article class="card legendary">
      <h3>Elites</h3>
      <div class="tagline">2% chance early → 5% late game · ★ = 1 modifier, ★★ after gamestage 100, ★★★ (25% of them) after gamestage 200</div>
      <ul>
        <li>Twice the health (change it with <code>aposelite health N</code> or <code>health</code> in Settings.xml). Stars above the name: <b>★</b> yellow, <b>★★</b> orange, <b>★★★</b> red. Visible up to 40 m, not through walls.</li>
        <li>Eridium on the ground glows purple and has a beam going up, like Borderlands loot — you can see it from afar.</li>
        <li><b>Reward:</b> ★ — weapon with affixes, quality 3–5, and 3–6 Eridium; ★★ — quality 5–6, 8–15 Eridium, 2% legendary; ★★★ — quality 6, 20–30 Eridium, 10% legendary. For weapon mastery an elite counts as 5 kills.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Modifier badges</h3>
      <div class="tagline">This is how they look under an elite's name in game</div>

<article class="card">
      <h3>Eridium</h3>
      <div class="tagline">Purple crystal · stacks to 500 · can't be sold to traders</div>
      <ul>
        <li><b>Sources:</b> elites; scrapping weapons with affixes (2 per affix, ×2 at quality 6); scrapping a legendary (50). Eridium arrives when scrapping has <b>finished</b> (cancelling in the queue gives nothing). In a closed workstation Eridium waits in the output slots along with the materials.</li>
        <li><b>Eridium Forge</b> — a separate workstation (recipe at a regular workbench). Hold a weapon, open the forge, and each affix gets buttons:</li>
        <li><b>Reroll</b> (10): this affix gets a new type and value.</li>
        <li><b>Lock</b> (25): this affix no longer changes. A weapon can have one locked affix. <b>Unlock</b> is free.</li>
        <li><b>Add</b> (20): a new affix in an empty row, if the quality allows more.</li>
        <li><b>Scrap</b>: turns the weapon into Eridium.</li>
        <li><b>Legendary of your choice</b> (300): any of the ten, quality 6.</li>
        <li><b>Sharpening</b> ("Weapon" and "Apparel" tabs): +1 quality at a time, up to 10, for weapons (and legendaries) and any worn clothing with stats that grow with quality. Up to 6 — always succeeds (5×N Eridium and forged steel). 7–10 — 35→50, success 65%→30%, <b>failure breaks the item</b> (you get back 30% of the scrap value). <b>"Safe"</b> (×5): failure only lowers quality by 1, not below 6. Each level above 6 gives as much as a quality step in vanilla.</li>
      </ul>
    </article>
  </div>
</section>

<section id="mastery" data-sec>
  <h2>Weapon mastery</h2>
  <p class="lead">Each weapon (any quality: a quality 2 and quality 6 machete are the same) levels up from kills while it's in your hands. 10 levels = 10 points in a tree of 20 skills, so you can only take half. <b>Alt+K</b> — tree window for the weapon in hand; or in the inventory click a weapon → the third button next to "Stats / Description".</p>
  <div class="grid">
    <article class="card legendary">
      <h3>How it works</h3>
      <ul>
        <li><b>Levels:</b> 4 / 12 / 24 / 40 / 60 / 90 / 120 / 160 / 210 / 260 kills. An elite counts as 5.</li>
        <li><b>Tree:</b> three branches going up from the root; each skill unlocks only next to a learned one. Mid-branch is a strong node, at the top a keystone (bold). Bridges connect the branches.</li>
        <li>Reaching one branch's keystone takes 6 points, so you can't finish two branches.</li>
        <li>The tree layout is shared per weapon class, points are separate for each weapon.</li>
        <li><b>Reset:</b> 5 Eridium per spent point, only within 5 m of the Eridium Forge.</li>
        <li>"Crit" — chance to double a hit; "Crit power" makes it even bigger. Elements and crowd control — chance per hit.</li>

<section id="perks" data-sec>
  <h2>Perks &amp; attributes</h2>
  <p class="lead">Every perk has its own trait at max level, and every attribute at level 10. Vanilla effects that duplicated the mod's traits have been replaced. The level description in game has a yellow AposMod line with exact numbers.</p>
  <div class="grid">
    <article class="card legendary">
      <h3>Attributes — <span class="trait">level 10</span></h3>
      <ul>
        <li><b>Perception — Executioner:</b> rifles, spears and explosives deal +100% damage to targets below 30% health.</li>
        <li><b>Strength — Overkill:</b> excess damage from a killing blow with a shotgun, club or sledgehammer carries over to the nearest zombie within 4 m.</li>
        <li><b>Fortitude — Iron Body:</b> no bleeding, no infection, and an existing infection is cured.</li>
        <li><b>Agility — Adrenaline:</b> kills with a pistol, bow or knife give +10% run speed for 15 s, up to 3 stacks.</li>
        <li><b>Intellect — Charged Chain Lightning:</b> each kill gives a lightning charge. At 10 charges your next hit with any weapon releases Chain Lightning around you that also deals damage: 4 s of shock and 200 damage to every zombie within 8 m.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Perception — <span class="trait">level 5</span></h3>
      <ul>
        <li><b>Flurry of Perception — Frenzy:</b> a spear kill gives +25% attack speed for 5 s.</li>
        <li><b>Demolitions Expert — Chain Reaction:</b> a zombie killed by your explosives explodes itself: 250 damage within 4 m.</li>
        <li><b>Penetrator — Shrapnel:</b> armor-piercing rounds deal 40% of the shot's damage to everyone within 3 m of the target.</li>
        <li><b>Infiltrator — Ghost:</b> while crouched you're twice as hard to spot, hits on a zombie that can't see you deal ×2, and mines and traps don't hurt you.</li>
        <li><b>Animal Tracker — Hunter's Mark:</b> hitting an animal puts a Mark on it.</li>
        <li><b>Treasure Hunter — X Marks the Spot:</b> the treasure search circle shrinks almost to a point, and the chest holds a quality 5–6 weapon with affixes.</li>
        <li><b>Salvage Operations — Junk Genius:</b> salvage tools wear out 90% slower.</li>

<section id="sets" data-sec>
  <h2>Armor sets &amp; wardrobe</h2>
  <p class="lead">Combat sets are now tied to playstyles: pieces give bonuses on one theme, and the full set boosts a mod trait. Piece numbers grow with quality, as in vanilla, and further up to 10 through sharpening. Percentage full-set bonuses at quality 7–10 grow by 5% for each level above 6 (the worst piece counts).</p>
  <div class="grid">
    <article class="card">
      <h3>Combat sets</h3>
      <ul>
        <li><b>Bruiser</b> (was Biker) — clubs and sledgehammers: damage, cheaper power attacks, HP, running. <b>Set:</b> Earthquake reaches 1 m farther, Home Run knocks back farther, Rage holds 1 more stack.</li>
        <li><b>Gunslinger</b> (was Enforcer) — pistols: accuracy, damage, reload, running. <b>Set:</b> Headhunter after 4 headshots instead of 5 and +30% damage while it's active.</li>
        <li><b>Ranger</b> — rifles: recoil, HP, damage, stamina. <b>Set:</b> Ricochet reaches 3 m farther and is 20% stronger.</li>
        <li><b>Commando</b> — assault rifles: magazine, recoil, damage, running. <b>Set:</b> Suppression slows 20% more, every 3rd hit returns a round.</li>
        <li><b>Hunter</b> (was Farmer) — bows and crossbows: damage, stealth, draw and reload speed, running. <b>Set:</b> Splinter +2 splinters, +20% to marked zombies.</li>
        <li><b>Preacher</b> — elements: fire and shock resistance, HP, gloves raise the chance of elemental mods. <b>Set:</b> fire, shock, acid and bleeding +50%, reactions recharge in 1.5 s.</li>
        <li><b>Nerd</b> — batons and robots. <b>Set:</b> Chain Lightning reaches 1 m farther, lightning charges build up twice as fast.</li>
        <li><b>Assassin</b> and <b>Raider</b> — as in vanilla, plus: Assassin +2 Bloodsucker stacks and ×1.5 to zombies that can't see you; Raider +2 Counter Punch charges and −15% damage taken at full charges.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Utility sets</h3>
      <ul>
        <li>Lumberjack, Miner, Scavenger, Rogue, Athletic — as in vanilla.</li>
        <li><b>Nomad</b> — plus −50% fuel and +10% vehicle speed (moved over from Biker).</li>
        <li><b>Primitive</b> — got the farming bonuses (seeds, harvest).</li>
        <li>DLC sets — cosmetic, no bonuses.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Wardrobe — <span class="trait">3 outfits</span></h3>
      <ul>
        <li><b>Alt+1 / Alt+2 / Alt+3</b> — change into an outfit in 1.5 s. Your current clothes go into the wardrobe and don't take backpack space.</li>
        <li><b>Alt+0</b> — wardrobe window with three tabs: what's in each outfit, "Put on" and "Take to backpack" buttons.</li>
        <li>How to fill it: put on the first set, press Alt+2, put on the second set from the backpack, press Alt+3 and put on the third.</li>
        <li>The wardrobe is saved with the world and isn't dropped on death.</li>
      </ul>
    </article>
  </div>
</section>
<section id="gear" data-sec>
  <h2>Mods &amp; legendary weapons</h2>
  <div class="grid">
    <article class="card">
      <h3><span class="trait">Energy Shield</span> mod</h3>
      <div class="tagline">Chest armor · workbench, armor mod loot, traders</div>
      <ul>
        <li>While the shield is charged, ranged attacks (bullets, arrows, spit) don't hurt you.</li>
        <li>Any hit drains the shield. It recharges after 5 s without damage.</li>
      </ul>
      <div class="k">Recipe</div>
      <div>6 electrical parts, 4 mechanical parts, 10 polymers, 10 forged iron, 2 duct tape.</div>
    </article>
    <article class="card">
      <h3>Elemental mods</h3>
      <div class="tagline">Any weapon · one elemental mod per weapon · workbench</div>
      <ul>
        <li><b>Incendiary:</b> 30% chance to ignite for 10 s: 10% of your last hit's damage per second (at least 10). (4 oil)</li>
        <li><b>Tesla</b> (can't go on batons — they already shock): 20% chance to shock for 1.5 s: 15% of the last hit's damage per second (at least 10). (5 electrical parts)</li>
        <li><b>Corrosive:</b> 25% chance to corrode for 6 s: −25 physical resistance, 8% of the last hit's damage per second (at least 8). (2 acid)</li>
      </ul>
      <div class="tagline">Plus 3 mechanical parts and 6 polymers in every recipe</div>
    </article>
    <article class="card legendary">
      <h3><span class="trait">Legendary weapons</span></h3>
      <div class="tagline">Gold name · trophy badge · always quality 6 · 4% in ★4 final chests, 10% in ★5 · Black Market</div>
      <p>Each legendary has 3 fixed affixes at quality 6 max and its own trait, so it's always at least as good as the best weapon with random affixes.</p>
      <ul>
        <li><b>Unkempt Harold</b> (.44 Desert Vulture): 3 bullets per shot in a fan. <i>Damage +35%, fire rate +25%, magazine +60%.</i></li>
        <li><b>Lady Fist</b> (9mm pistol): +50% damage, every hit heals 5 HP, a headshot 25 HP. <i>Headshot damage +60%, spread −40%, reload +40%.</i></li>
        <li><b>Dragon's Breath</b> (pump shotgun): +20%, every hit ignites. <i>Pellets +35%, damage +35%, reload +40%.</i></li>
        <li><b>The Ripper</b> (machete): +40%, every hit causes bleeding, +50% more to targets already bleeding; a kill heals 20 HP. <i>Damage +35%, attack speed +20%, life steal 6% of damage.</i></li>
        <li><b>Thunderclap</b> (steel sledgehammer): +25%, a power attack shocks everyone within 4 m. Each kill gives a storm charge; at 3 charges a power attack calls down lightning: 150 damage and 3 s of shock to everyone within 6 m. <i>Damage +35%, stamina per hit −40%, headshot damage +60%.</i></li>
        <li><b>Hornet</b> (SMG-5): +40% damage, hits have a 50% chance to corrode with acid, +25% more against corroded targets. <i>Magazine +60%, fire rate +25%, recoil −50%.</i></li>
        <li><b>Storm Fist</b> (steel knuckles): +20%, hits have a 25% chance to ignite and a 25% chance to shock, so Confusion triggers on its own. <i>Attack speed +20%, damage +35%, movement speed +10%.</i></li>
        <li><b>Artemis</b> (compound bow): +40% damage, every arrow ignites and shatters into 10 splinters of 100 each (or half the arrow's hit). <i>Damage +35%, headshot damage +60%, reload +40%.</i></li>
        <li><b>Big Boom</b> (rocket launcher): 50% chance the next rocket is free. <i>Damage +35%, reload +40%, range +60%.</i></li>
        <li><b>Predator</b> (sniper rifle): +25%, every headshot ricochets within 15 m: 100 damage and 2 s of stun. <i>Headshot damage +60%, range +60%, recoil −50%.</i></li>
      </ul>
    </article>
  </div>
</section>

  <p class="tagline" style="margin-top:8px">These are the game's own 3D numbers (they fan out from the head), just in the mod's colors. Visible up to 120 m, distant numbers get bigger, they stay for 3 s. The mod turns them on even if the world option is off.</p>

  <div class="grid" style="margin-top:14px">
    <article class="card">
      <h3>Damage number settings — <span class="trait">aposdmg</span></h3>
      <div class="tagline">F1 console · saved in Mods/AposMod/Settings.xml</div>
      <pre>aposdmg              show status
aposdmg on | off     turn on / off
aposdmg size 1.5     size 0.5–3
aposdmg time 3       seconds visible (0.5–5)
aposdmg kill off     no "Kill!" text
aposdmg color off    no cyan color</pre>
    </article>
    <article class="card">
      <h3>Affix testing — <span class="trait">aposaffix</span></h3>
      <div class="tagline">F1 console · weapon in hand</div>
      <pre>aposaffix            new affixes, max for the quality
aposaffix 6          set quality 6 first, then 3 affixes</pre>
    </article>
    <article class="card">
      <h3>Elites — <span class="trait">aposelite</span></h3>
      <div class="tagline">F1 console</div>
      <pre>aposelite on | off           names above elites
aposelite health N           max health x N (1-50, default 2)
aposelite make               nearest zombie becomes an elite
aposelite make Armored Giant  with these modifiers</pre>
    </article>
    <article class="card">
      <h3>Bow — <span class="trait">aposbow</span></h3>
      <div class="tagline">F1 console · if the backpack or a vehicle won't open with a bow</div>
      <pre>aposbow          reload state of the bow in hand
aposbow off | on  turn off / on arrow auto-nock</pre>
    </article>
    <article class="card">
      <h3>Stealth</h3>
      <ul>
        <li>Zombies in POIs that used to rush out in a wave after a trigger or attack right away now spawn asleep in their spots as you approach. Triggers (doors, loot, walls) don't wake them. Zombies spawn in advance: 12 m away and from the neighboring floor (the base game uses 8 m and only your floor), so they don't pop in right in front of you.</li>
        <li>They wake up from noise or when they see you, so you can sneak up on them.</li>
        <li>To turn off: <code>&lt;Stealth rework="false"/&gt;</code> in Settings.xml and restart the game.</li>

        <li>Second Wind (5 min) and Second Lungs (60 s) cooldown</li>

    </article>
    <article class="card">
      <h3>Дубинки и кувалды — <span class="trait">Rage</span></h3>
      <div class="tagline">Перк: Rage (вместо Grand Slam)</div>
      <ul>
        <li>Убийство дубинкой, битой или кувалдой даёт стак на 8 с: +10% урона, +5% скорости атаки.</li>
        <li>Максимум стаков равен уровню перка (1–5).</li>
      </ul>
      <div class="five"><b>5 уровень — Rampage:</b> на 5 стаках удары не тратят выносливость, а вас нельзя оглушить или сбить с ног.</div>
    </article>

    <article class="card">
      <h3>Жезлы — <span class="trait">Chain Lightning</span></h3>
      <div class="tagline">Перк: Calculated Attack · жезлы и дубинка из трубы</div>
      <ul>
        <li>Обычный удар ненадолго шокирует цель.</li>
        <li>Силовой удар шокирует всех зомби вокруг.</li>
      </ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Шок обычным</td><td>0.5 с</td><td>0.6</td><td>0.7</td><td>0.8</td><td>0.9</td><td>1.0</td></tr><tr><td>Радиус силового</td><td>3 м</td><td>3.5</td><td>4</td><td>4.5</td><td>5</td><td>5.5</td></tr><tr><td>Шок силовым</td><td>2 с</td><td>2.4</td><td>2.8</td><td>3.2</td><td>3.6</td><td>4.0</td></tr></table></div>
      <div class="cost">Перезарядка 3 с. Силовой удар тратит на 50% больше выносливости.</div>
      <div class="five"><b>5 уровень:</b> каждый 4-й обычный удар тоже запускает Chain Lightning.</div>
    </article>

    <article class="card">
      <h3>Копья — <span class="trait">Battering Ram</span></h3>
      <div class="tagline">Перк: Spear Master</div>
      <ul>
        <li>Обычный удар отталкивает цель.</li>
        <li>Силовой удар пробивает зомби позади и отбрасывает каждого.</li>
      </ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Пробитие силовым</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr><tr><td>Сила толчка</td><td>120</td><td>160</td><td>200</td><td>240</td><td>280</td><td>320</td></tr></table></div>
      <div class="five"><b>5 уровень — Skewer:</b> все зомби, которых задел силовой удар, падают с ног.</div>
    </article>

    <article class="card">
      <h3>Кастеты — <span class="trait">Counter Punch</span></h3>
      <div class="tagline">Перк: The Brawler</div>
      <ul>
        <li>Полученный удар заполняет заряды. Таймера нет.</li>
        <li>Обычный удар: +25% урона, минус 1 заряд; может дать новый заряд.</li>
        <li>Силовой удар: тратит все заряды, +50% урона за каждый, сбивает с ног.</li>
      </ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Заряды</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>7</td></tr><tr><td>Шанс +1 заряд</td><td>—</td><td>10%</td><td>20%</td><td>30%</td><td>40%</td><td>50%</td></tr></table></div>
      <div class="five"><b>5 уровень — Knockout:</b> силовой удар на полных зарядах убивает любого не элитного зомби.</div>
    </article>


  </div>
</section>

<section id="ranged" data-sec>
  <h2>Дальний бой</h2>
  <p class="lead">Каждая фишка растёт вместе с перком своего оружия.</p>
  <div class="grid">

    <article class="card">
      <h3>Пистолеты и ПП — <span class="trait">Headhunter</span></h3>
      <div class="tagline">Перк: Gunslinger</div>
      <ul>
        <li>5 хедшотов подряд (4 в полном сете Gunslinger) включают режим усиленных выстрелов. Промах или попадание в тело обнуляет серию.</li>
        <li>Усиленные выстрелы бьют сильнее и почти без разброса.</li>
      </ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Выстрелов</td><td>10</td><td>12</td><td>14</td><td>16</td><td>18</td><td>20</td></tr><tr><td>Урон</td><td>+25%</td><td>+35%</td><td>+45%</td><td>+55%</td><td>+65%</td><td>+75%</td></tr></table></div>
      <div class="five"><b>5 уровень:</b> каждое убийство <b>в голову</b> в этом режиме добавляет ещё 2 выстрела.</div>
    </article>
    <article class="card">
      <h3>Дробовики — <span class="trait">Slug Knockback</span></h3>
      <ul>
        <li>Пуля (Slug и Breaching Slug) отбрасывает зомби и сбивает его с ног. Дробь работает как раньше.</li>
        <li>Breaching Slug бьёт только до 4 м — так задумано в самой игре.</li>
      </ul>
    </article>

    <article class="card">
      <h3>Винтовки — <span class="trait">Ricochet</span></h3>
      <div class="tagline">Перк: Dead Eye</div>
      <ul><li>Хедшот ранит всех зомби рядом с местом попадания.</li></ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Радиус</td><td>5 м</td><td>7</td><td>9</td><td>11</td><td>13</td><td>15</td></tr><tr><td>Урон</td><td>20</td><td>30</td><td>40</td><td>50</td><td>60</td><td>70</td></tr></table></div>
      <div class="five"><b>5 уровень:</b> рикошет ещё и оглушает всех, кого задел, на 2 с.</div>
    </article>

    <article class="card">
      <h3>Автоматы и пулемёты — <span class="trait">Suppression</span></h3>
      <div class="tagline">Перк: Machine Gunner</div>
      <ul>
        <li>Каждое попадание добавляет цели 5% замедления на 8 с — до максимума из таблицы.</li>
        <li>Каждое 4-е попадание возвращает 1 патрон в магазин (каждое 3-е в полном сете Commando).</li>
      </ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Макс. замедление</td><td>10%</td><td>20%</td><td>30%</td><td>40%</td><td>50%</td><td>60%</td></tr></table></div>
      <div class="five"><b>5 уровень:</b> +25% урона по полностью замедленным, а каждое убийство приносит 5 патронов того типа, что заряжен.</div>
    </article>

    <article class="card">
      <h3>Луки — <span class="trait">Splinter</span></h3>
      <div class="tagline">Перк: Archery</div>
      <ul><li>Стрела при попадании разлетается на осколки. Каждый осколок летит в ближайшего другого зомби в радиусе 5 м.</li></ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Осколков</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td><td>8</td></tr><tr><td>Урон осколка, минимум</td><td>40</td><td>50</td><td>60</td><td>70</td><td>80</td><td>100</td></tr></table></div>
      <ul><li>Если стрела попала сильнее, осколок берёт <b>половину её урона</b> (до 300).</li></ul>
      <div class="five"><b>5 уровень:</b> стрела в голову поджигает цель.</div>
      <ul>
        <li><b>Управление:</b> лук сам накладывает следующую стрелу, пока он в руках. <b>R</b> сразу открывает колесо стрел без задержки: зажмите, наведите, отпустите.</li>
      </ul>
    </article>

    <article class="card">
      <h3>Особые стрелы</h3>
      <div class="tagline">Только луки · крафт в рюкзаке, 3 шт.</div>
      <ul>
        <li><b>Кислотная</b> (+1 гнилая плоть): разъедает (−25% физзащиты, кислота каждую секунду) и <b>замедляет на 90%</b>. Длительность по Archery: 5 с (0–1), 6 / 7 / 8 с (2 / 3 / 4), 10 с (5).</li>
        <li><b>Электрическая</b> (+1 электродеталь): ток на 4 с, урон каждую секунду растёт от попадания.</li>
        <li><b>Зазубренная</b> (+1 кованая сталь): глубокое кровотечение на 10 с, 15% от попадания каждую секунду (мин. 12), плюс обычное кровотечение. В сумме ещё ≈1,5 попадания: выстрелил и держи дистанцию.</li>
        <li>Кислота и ток запускают реакции стихий.</li>
      </ul>
    </article>

    <article class="card">
      <h3>Арбалеты — <span class="trait">Mark · Pin</span></h3>
      <div class="tagline">Перк: Archery</div>
      <ul>
        <li><b>Mark:</b> болт помечает зомби на 10 с. Весь ваш урон по нему, любым оружием, растёт. Над помеченным зомби светится красное кольцо-прицел, видно даже сквозь стены.</li>
        <li><b>Pin</b> (только арбалеты, не луки): если за зомби до 3 м стена, болт прибивает его до самой смерти. Элитного — на 10 с.</li>
      </ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Бонус Mark</td><td>+20%</td><td>+40%</td><td>+60%</td><td>+80%</td><td>+100%</td><td>+120%</td></tr></table></div>
      <div class="five"><b>5 уровень — Hunting Party:</b> болт помечает всех зомби в радиусе 4 м от попадания.</div>
    </article>


  </div>
</section>

<section id="elements" data-sec>
  <h2>Стихии и реакции</h2>
  <p class="lead">Три стихии: огонь, ток и кислота. Две стихии на одном зомби запускают реакцию. После неё у зомби 3 с перезарядки реакций.</p>
  <div class="grid">
    <article class="card reaction">
      <h3>Огонь + кислота = <span class="trait">Explosion</span></h3><div class="formula" aria-hidden="true"><span class="el fire"><svg class="hi"><use href="#i-fire"/></svg></span>+<span class="el acid"><svg class="hi"><use href="#i-drop"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-bomb"/></svg></span></div>
      <ul><li>Взрыв: 50% урона вашего последнего удара (минимум 60) цели и всем зомби в радиусе 4 м. Вас не задевает.</li></ul>
    </article>
    <article class="card reaction">
      <h3>Огонь + ток = <span class="trait">Confusion</span></h3><div class="formula" aria-hidden="true"><span class="el fire"><svg class="hi"><use href="#i-fire"/></svg></span>+<span class="el shock"><svg class="hi"><use href="#i-bolt"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-eye"/></svg></span></div>
      <ul><li>5 с: зомби медленнее на 60%, получает больше урона (−30 сопротивления), на миг оглушён.</li></ul>
    </article>
    <article class="card reaction">
      <h3>Ток + кислота = <span class="trait">Miasma</span></h3><div class="formula" aria-hidden="true"><span class="el shock"><svg class="hi"><use href="#i-bolt"/></svg></span>+<span class="el acid"><svg class="hi"><use href="#i-drop"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-flask"/></svg></span></div>
      <ul><li>6 с: максимальное здоровье зомби падает на 20%, вместе с ним падает и текущее. Плюс кровотечение.</li></ul>
    </article>
    <article class="card">
      <h3>Откуда берутся стихии</h3>
      <ul>
        <li><b>Огонь:</b> мод Incendiary, молотов, огненные стрелы, Splinter на 5 уровне, легендарки Dragon's Breath, Storm Fist, Artemis.</li>
        <li><b>Ток:</b> мод Tesla, жезлы (Chain Lightning), легендарки Thunderclap, Storm Fist.</li>
        <li><b>Кислота:</b> мод Corrosive, легендарка Hornet.</li><li><b>Кровотечение</b> от ваших ударов (ножи, зубчатое лезвие, колючая проволока, Ripper): каждую секунду 5% урона последнего удара (минимум 5).</li><li>Ванильный мод <b>Burning Shaft</b> (горящее древко) поджигает с шансом 5–30% вместо 10–60%: его огонь теперь тоже зависит от урона удара.</li>
      </ul>
    </article>
  </div>
</section>

<section id="explosives" data-sec>
  <h2>Взрывчатка, самоделки и роботы</h2>
  <div class="grid">
    <article class="card">
      <h3>Гранаты — <span class="trait">Wide Blast</span></h3>
      <ul><li>Граната, контактная граната и самодельная бомба: радиус поражения зомби увеличен втрое. Разрушение блоков не изменилось.</li></ul>
    </article>
    <article class="card">
      <h3>Молотов — <span class="trait">Busy Burning</span></h3>
      <ul><li>Горящий зомби двигается на 70% медленнее и каждую секунду теряет 4% максимального здоровья (минимум 15) сверх обычного огня.</li><li>Лужа горит вдвое дольше. Вас огонь не замедляет.</li></ul>
    </article>
    <article class="card">
      <h3>Ракетница — <span class="trait">Early Artillery</span></h3>
      <ul><li>Продаётся у торговцев и попадается в луте с начала игры.</li><li>В финальном сундуке может лежать и сама ракетница: 6% на ★2, 10% на ★3, 15% на ★4, 20% на ★5.</li><li>В финальном сундуке каждого здания есть ракеты:</li></ul>
      <div class="scale"><table><tr><th>Звёзды</th><th>★1</th><th>★2</th><th>★3</th><th>★4</th><th>★5</th></tr><tr><td>Ракет</td><td>1</td><td>1–2</td><td>2–3</td><td>3–4</td><td>4–6</td></tr></table></div>
    </article>
    <article class="card">
      <h3>Самодельное оружие — <span class="trait">Veteran Junk</span></h3>
      <ul><li>Каждое убийство самодельным оружием: +2% урона всему самодельному оружию, до +1000%. Текущий бонус виден на баффе.</li><li>Ремонтируется железным ломом.</li></ul>
    </article>
    <article class="card">
      <h3>Роботы — <span class="trait">Guardian Protocol</span></h3>
      <div class="tagline">Перк: Robotics Inventor · турель и робо-кувалда</div>
      <ul><li>Когда ваше здоровье ниже 30%, роботы атакуют быстрее и сильнее. Появляется бафф-индикатор.</li></ul>
      <div class="scale"><table><tr><th>Уровень</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr><tr><td>Скорость</td><td>+30%</td><td>+40%</td><td>+50%</td><td>+60%</td><td>+70%</td><td>+80%</td></tr><tr><td>Урон</td><td>+10%</td><td>+15%</td><td>+20%</td><td>+25%</td><td>+30%</td><td>+35%</td></tr></table></div>
      <div class="five"><b>5 уровень:</b> включается уже при здоровье ниже 50%.</div>
    </article>
  </div>
</section>

<section id="affixes" data-sec>
  <h2>Аффиксы</h2>
  <p class="lead">Оружие из лута, с зомби и у торговцев получает случайные аффиксы — бонусы к характеристикам, как в Borderlands. Скрафченное оружие их не имеет. Чем выше качество, тем больше аффиксов и тем они сильнее.</p>
  <div class="grid">
    <article class="card">
      <h3>Сколько аффиксов</h3>
      <ul>
        <li><b>Качество 1:</b> без аффиксов.</li>
        <li><b>Качество 2–3:</b> до 1 (шанс 50%).</li>
        <li><b>Качество 4–5:</b> до 2 (75% / 35%).</li>
        <li><b>Качество 6:</b> до 3 (100% / 60% / 30%), значения на максимуме.</li>
        <li>Одинаковых аффиксов на одном оружии не бывает. После объединения двух стволов лишние аффиксы исчезают.</li>
        <li>Аффиксы видны вверху подсказки предмета, а на иконке есть значок-звёздочка.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Огнестрельное оружие, луки, ракетница</h3>
      <div class="tagline">Значения: качество 2 → качество 6</div>
      <ul>
        <li><b>Скорострельность</b> +5% → +25%</li>
        <li><b>Разброс</b> −10% → −40%</li>
        <li><b>Дальность</b> +10% → +60%</li>
        <li><b>Урон</b> +5% → +35%</li>
        <li><b>Скорость перезарядки</b> +10% → +40%</li>
        <li><b>Дробины</b> (дробовики) +10% → +35%</li>
        <li><b>Вторая пуля</b> (пистолеты, винтовки, автоматы, только качество 6): 2 пули за выстрел, каждая −40% урона</li>
        <li><b>Урон в голову</b> +10% → +60%</li>
        <li><b>Размер магазина</b> +10% → +60% (не на луках и арбалетах)</li>
        <li><b>Скорость передвижения</b> с оружием в руках +2% → +10%</li>
        <li><b>Отдача</b> −10% → −50%</li>
      </ul>
    </article>
    <article class="card">
      <h3>Ближний бой</h3>
      <div class="tagline">Значения: качество 2 → качество 6</div>
      <ul>
        <li><b>Урон</b> +5% → +35%</li>
        <li><b>Скорость атаки</b> +4% → +20%</li>
        <li><b>Выносливость на удар</b> −10% → −40%</li>
        <li><b>Урон в голову</b> +10% → +60%</li>
        <li><b>Дальность удара</b> +5% → +20%</li>
        <li><b>Скорость передвижения</b> +2% → +10%</li>
        <li><b>Лечение от урона</b> 1% → 6% от нанесённого урона</li>
        <li><b>Шанс отрубить конечность</b> +5% → +30%</li>
        <li><b>Прочность</b> +20% → +80%</li>
        <li><b>Урон по блокам</b> +10% → +60%</li>
      </ul>
    </article>
  </div>
</section>

<section id="elites" data-sec>
  <h2>Элитные зомби и Эридий</h2>
  <p class="lead">Иногда зомби появляется элитным: над головой его имя с модификаторами, как в Borderlands. Он сильнее, но гарантированно даёт оружие с аффиксами и Эридий, а за Эридий можно довести свой ствол до идеала.</p>
  <div class="grid">
    <article class="card legendary">
      <h3>Элиты</h3>
      <div class="tagline">Шанс 2% в начале → 5% в поздней игре · ★ = 1 модификатор, ★★ после gamestage 100, ★★★ (25% из них) после gamestage 200</div>
      <ul>
        <li>Здоровья вдвое больше (меняется командой <code>aposelite health N</code> или <code>health</code> в Settings.xml). Над именем звёзды: <b>★</b> жёлтая, <b>★★</b> оранжевые, <b>★★★</b> красные. Видно до 40 м, сквозь стены — нет.</li>
        <li>Эридий на земле светится фиолетовым и имеет луч вверх, как лут в Borderlands, — его видно издалека.</li>
        <li><b>Награда:</b> ★ — оружие с аффиксами качества 3–5 и 3–6 Эридия; ★★ — качество 5–6, 8–15 Эридия, 2% легендарка; ★★★ — качество 6, 20–30 Эридия, 10% легендарка. Для мастерства оружия элита = 5 убийств.</li>
      </ul>

<article class="card">
      <h3>Эридий</h3>
      <div class="tagline">Фиолетовый кристалл · стопка 500 · торговцам не продаётся</div>
      <ul>
        <li><b>Откуда:</b> элиты; разборка оружия с аффиксами (2 за аффикс, ×2 на качестве 6); разборка легендарки (50). Эридий приходит, когда разборка <b>завершилась</b> (отмена в очереди ничего не даёт). В закрытом верстаке Эридий ждёт в выходных слотах вместе с материалами.</li>
        <li><b>Кузня эридия</b> — отдельный верстак (рецепт на обычном верстаке). Возьмите оружие в руки, откройте кузню, и возле каждого аффикса будут кнопки:</li>
        <li><b>Перебрать</b> (10): этот аффикс получает новый тип и значение.</li>
        <li><b>Зафиксировать</b> (25): этот аффикс больше не меняется. На оружии может быть один защищённый аффикс. <b>Снять фиксацию</b> — бесплатно.</li>
        <li><b>Добавить</b> (20): новый аффикс в пустую строку, если качество позволяет больше.</li>
        <li><b>Разобрать</b>: оружие превращается в Эридий.</li>
        <li><b>Легендарка на выбор</b> (300): любая из десяти, качество 6.</li>
        <li><b>Заточка</b> (вкладки «Оружие» и «Одежда»): +1 качество за раз, до 10, для оружия (и легендарок) и любой надетой одежды с характеристиками, растущими с качеством. До 6 — всегда успешно (5×N Эридия и кованой стали). 7–10 — 35→50, успех 65%→30%, <b>неудача ломает предмет</b> (возвращается 30% от разборки). <b>«Безопасно»</b> (×5): неудача лишь снижает качество на 1, не ниже 6. Каждый уровень выше 6 даёт столько же, сколько шаг качества в ванили.</li>
      </ul>

<section id="mastery" data-sec>
  <h2>Мастерство оружия</h2>
  <p class="lead">Каждое оружие (любого качества: мачете 2 и 6 уровня — одно и то же) растёт от убийств, пока оно в руках. 10 уровней = 10 очков в дерево из 20 навыков, так что взять можно лишь половину. <b>Alt+K</b> — окно дерева оружия в руках; или в инвентаре клик по оружию → третья кнопка рядом со «Статистика / Описание».</p>
  <div class="grid">
    <article class="card legendary">
      <h3>Как работает</h3>
      <ul>
        <li><b>Уровни:</b> 4 / 12 / 24 / 40 / 60 / 90 / 120 / 160 / 210 / 260 убийств. Элита считается за 5.</li>
        <li><b>Дерево:</b> три ветки вверх от корня; каждый навык открывается только рядом с изученным. В середине ветки — сильный узел, наверху — ключевой (жирные). Перемычки соединяют ветки.</li>
        <li>До ключевого узла одной ветки — 6 очков, так что две ветки до конца не пройти.</li>
        <li>Форма дерева общая для класса оружия, очки — отдельные для каждого оружия.</li>
        <li><b>Сброс:</b> 5 Эридия за каждое вложенное очко, только в пределах 5 м от Кузни эридия.</li>
        <li>«Крит» — шанс удвоить удар; «Сила крита» делает его ещё больше. Стихии и контроль — шанс на каждый удар.</li>
      </ul>
    </article>

      <div class="tagline">Корень: Урон +5%</div>
      <ul>
        <li>Скорость +5% → Скорость +6% → <b>Убийство: скорость +20% 6 с</b> → Расход выносливости −15% → <b class="trait">Комбо +8%/удар (до 5)</b></li>
        <li>Урон +6% → Кровотечение 20% → <b>Добивание (&lt;35% HP) +30%</b> → Кровотечение 20% → <b class="trait">Глубокое кровотечение 35%</b></li>
        <li>Крит 5% (×2) → Вампиризм 3% → <b>Первый удар (полное HP) +60%</b> → Вампиризм 4% → <b class="trait">Сила крита +100%</b></li>
        <li><small>Перемычки: Расход выносливости −10% · Расчленение +10% · Урон +6% · Крит 5% (×2)</small></li>
      </ul>

      <h3>Дубинки и биты</h3>

    <article class="card"><h3>Skull Crusher</h3><ul><li>Убрано: шансы сбить с ног силовым ударом.</li><li>Взамен: Earthquake наносит 10…50 урона каждому сбитому.</li></ul></article>
    <article class="card"><h3>The Brawler</h3><ul><li>Убрано: силовой удар оглушает, а в голову — сбивает с ног.</li><li>Взамен: обычный удар с шансом 10…50% даёт заряд Counter Punch.</li></ul></article>
  </div>
</section>

<section id="sets" data-sec>
  <h2>Сеты брони и гардероб</h2>
  <p class="lead">Боевые сеты теперь привязаны к стилям игры: части дают бонусы на одну тему, а полный сет усиливает фишку мода. Числа частей растут с качеством, как в ванили, и дальше до 10 через заточку. Процентные бонусы полного сета на качестве 7–10 растут на 5% за каждый уровень выше 6 (считается худшая часть).</p>
  <div class="grid">
    <article class="card">
      <h3>Боевые сеты</h3>
      <ul>
        <li><b>Bruiser</b> (был Biker) — дубинки и кувалды: урон, более дешёвые силовые удары, HP, бег. <b>Сет:</b> Earthquake на 1 м дальше, Home Run отбрасывает дальше, Rage держит на 1 стак больше.</li>
        <li><b>Gunslinger</b> (был Enforcer) — пистолеты: точность, урон, перезарядка, бег. <b>Сет:</b> Headhunter после 4 хедшотов вместо 5 и +30% урона, пока он действует.</li>
        <li><b>Ranger</b> — винтовки: отдача, HP, урон, выносливость. <b>Сет:</b> Ricochet на 3 м дальше и на 20% сильнее.</li>
        <li><b>Commando</b> — автоматы: магазин, отдача, урон, бег. <b>Сет:</b> Suppression замедляет ещё на 20%, каждое 3-е попадание возвращает патрон.</li>
        <li><b>Hunter</b> (был Farmer) — луки и арбалеты: урон, тишина, скорость натяжения и перезарядки, бег. <b>Сет:</b> Splinter +2 осколка, по помеченным зомби +20%.</li>
        <li><b>Preacher</b> — стихии: сопротивление огню и току, HP, перчатки повышают шанс стихийных модов. <b>Сет:</b> огонь, ток, кислота и кровотечение +50%, реакции перезаряжаются за 1.5 с.</li>
        <li><b>Nerd</b> — жезлы и роботы. <b>Сет:</b> Chain Lightning на 1 м дальше, заряды молнии копятся вдвое быстрее.</li>
        <li><b>Assassin</b> и <b>Raider</b> — как в ванили, плюс: Assassin +2 стака Bloodsucker и ×1.5 по зомби, которые вас не видят; Raider +2 заряда Counter Punch и −15% получаемого урона при полных зарядах.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Хозяйственные сеты</h3>
      <ul>
        <li>Lumberjack, Miner, Scavenger, Rogue, Athletic — как в ванили.</li>
        <li><b>Nomad</b> — плюс −50% топлива и +10% скорости транспорта (переехало из Biker).</li>
        <li><b>Primitive</b> — получил фермерские бонусы (семена, урожай).</li>
        <li>DLC-сеты — косметика, без бонусов.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Гардероб — <span class="trait">3 комплекта</span></h3>
      <ul>
        <li><b>Alt+1 / Alt+2 / Alt+3</b> — переодеться в комплект за 1.5 с. Текущая одежда убирается в гардероб, рюкзак не занимает.</li>
        <li><b>Alt+0</b> — окно гардероба с тремя вкладками: что в каждом комплекте, кнопки «Надеть» и «Забрать в рюкзак».</li>
        <li>Как заполнить: наденьте первый сет, нажмите Alt+2, наденьте второй сет из рюкзака, нажмите Alt+3 и наденьте третий.</li>
        <li>Гардероб сохраняется вместе с миром и не выпадает после смерти.</li>
      </ul>
    </article>
  </div>
</section>
<section id="gear" data-sec>
  <h2>Моды и легендарное оружие</h2>
  <div class="grid">
    <article class="card">
      <h3>Мод <span class="trait">Energy Shield</span></h3>
      <div class="tagline">Нагрудник · верстак, лут модов брони, торговцы</div>
      <ul>
        <li>Пока щит заряжен, дальние атаки (пули, стрелы, плевки) вам не вредят.</li>
        <li>Любое попадание разряжает щит. Он заряжается снова через 5 с без урона.</li>
      </ul>
      <div class="k">Рецепт</div>
      <div>6 электродеталей, 4 механические детали, 10 полимеров, 10 кованого железа, 2 рулона изоленты.</div>
    </article>
    <article class="card">
      <h3>Стихийные моды</h3>
      <div class="tagline">Любое оружие · один стихийный мод на оружие · верстак</div>
      <ul>
        <li><b>Incendiary:</b> с шансом 30% поджигает на 10 с: каждую секунду 10% урона вашего последнего удара (минимум 10). (4 масла)</li>
        <li><b>Tesla</b> (не ставится на жезлы — они и так шокируют): с шансом 20% шокирует на 1.5 с: каждую секунду 15% урона последнего удара (минимум 10). (5 электродеталей)</li>
        <li><b>Corrosive:</b> с шансом 25% разъедает на 6 с: −25 физического сопротивления, каждую секунду 8% урона последнего удара (минимум 8). (2 кислоты)</li>
      </ul>
      <div class="tagline">Плюс 3 механические детали и 6 полимеров в каждом рецепте</div>
    </article>
    <article class="card legendary">
      <h3><span class="trait">Легендарное оружие</span></h3>
      <div class="tagline">Золотое название · значок-трофей · всегда качество 6 · 4% в финальных сундуках ★4, 10% в ★5 · Black Market</div>
      <p>Каждая легендарка имеет 3 постоянных аффикса на максимуме качества 6 и собственную фишку, поэтому она всегда не хуже лучшего оружия со случайными аффиксами.</p>
      <ul>
        <li><b>Unkempt Harold</b> (.44 Desert Vulture): 3 пули за выстрел веером. <i>Урон +35%, скорострельность +25%, магазин +60%.</i></li>
        <li><b>Lady Fist</b> (9-мм пистолет): +50% урона, каждое попадание лечит 5 HP, хедшот — 25 HP. <i>Урон в голову +60%, разброс −40%, перезарядка +40%.</i></li>
        <li><b>Dragon's Breath</b> (помповый дробовик): +20%, каждое попадание поджигает. <i>Дробины +35%, урон +35%, перезарядка +40%.</i></li>
        <li><b>The Ripper</b> (мачете): +40%, каждый удар вызывает кровотечение, по тем, кто уже истекает кровью, ещё +50%; убийство лечит 20 HP. <i>Урон +35%, скорость атаки +20%, лечение 6% от урона.</i></li>
        <li><b>Thunderclap</b> (стальная кувалда): +25%, силовой удар шокирует всех в 4 м. Каждое убийство даёт грозовой заряд, на 3 зарядах силовой удар вызывает молнию: 150 урона и 3 с шока всем в 6 м. <i>Урон +35%, выносливость на удар −40%, урон в голову +60%.</i></li>
        <li><b>Hornet</b> (SMG-5): +40% урона, попадание с шансом 50% разъедает кислотой, по разъеденным целям ещё +25%. <i>Магазин +60%, скорострельность +25%, отдача −50%.</i></li>
        <li><b>Storm Fist</b> (стальные кастеты): +20%, удар с шансом 25% поджигает и с шансом 25% шокирует, так что Confusion включается сама. <i>Скорость атаки +20%, урон +35%, скорость передвижения +10%.</i></li>
        <li><b>Artemis</b> (блочный лук): +40% урона, каждая стрела поджигает и разлетается на 10 осколков по 100 (или половине урона стрелы). <i>Урон +35%, урон в голову +60%, перезарядка +40%.</i></li>
        <li><b>Big Boom</b> (ракетница): с шансом 50% следующая ракета бесплатная. <i>Урон +35%, перезарядка +40%, дальность +60%.</i></li>
        <li><b>Predator</b> (снайперская винтовка): +25%, каждый хедшот рикошетит на 15 м: 100 урона и 2 с оглушения. <i>Урон в голову +60%, дальность +60%, отдача −50%.</i></li>
      </ul>
    </article>
  </div>
</section>

<section id="systems" data-sec>
  <h2>Системы</h2>
  <div class="k" style="margin-bottom:8px">Цвета цифр урона</div>
  <div class="legend">
    <div class="dmg"><span class="num n-white">45</span><span>Обычный удар</span></div>
    <div class="dmg"><span class="num n-yellow">90!</span><span>Хедшот</span></div>
    <div class="dmg"><span class="num n-cyan">120</span><span>Удар, усиленный баффом: Headhunter, Rage, Counter Punch, Mark, Suppression, кислота</span></div>
    <div class="dmg"><span class="num n-red">Труп!</span><span>Смертельный удар (надпись над цифрой)</span></div>
    <div class="dmg"><span class="num n-magenta">60</span><span>Реакция стихий</span></div>
    <div class="dmg"><span class="num n-orange">8</span><span>Горение</span></div>
    <div class="dmg"><span class="num n-green">3</span><span>Кислота</span></div>
    <div class="dmg"><span class="num n-blue">5</span><span>Ток</span></div>
    <div class="dmg"><span class="num n-pink">4</span><span>Кровотечение</span></div>
    <div class="dmg"><span class="num" style="color:#ff7373">25</span><span>Урон по вам</span></div>
  </div>
  <p class="tagline" style="margin-top:8px">Цифры — игровые 3D-цифры (разлетаются веером от головы), только в цветах мода. Видны до 120 м, дальние цифры увеличиваются, держатся 3 с. Включаются модом, даже если опция мира выключена.</p>

  <div class="grid" style="margin-top:14px">
    <article class="card">
      <h3>Настройки цифр — <span class="trait">aposdmg</span></h3>
      <div class="tagline">Консоль F1 · сохраняется в Mods/AposMod/Settings.xml</div>
      <pre>aposdmg              показать состояние
aposdmg on | off     включить / выключить
aposdmg size 1.5     размер 0.5–3
aposdmg time 3       сколько секунд видно (0.5–5)
aposdmg kill off     без надписи «Труп!»
aposdmg color off    без голубого цвета</pre>
    </article>
    <article class="card">
      <h3>Проверка аффиксов — <span class="trait">aposaffix</span></h3>
      <div class="tagline">Консоль F1 · оружие в руках</div>
      <pre>aposaffix            новые аффиксы, максимум для качества
aposaffix 6          сначала качество 6, потом 3 аффикса</pre>
    </article>
    <article class="card">
      <h3>Элиты — <span class="trait">aposelite</span></h3>
      <div class="tagline">Консоль F1</div>
      <pre>aposelite on | off           имена над элитами
aposelite health N           максимум здоровья x N (1-50, по умолчанию 2)
aposelite make               ближайший зомби становится элитой
aposelite make Armored Giant  с этими модификаторами</pre>
    </article>
    <article class="card">
      <h3>Лук — <span class="trait">aposbow</span></h3>
      <div class="tagline">Консоль F1 · если с луком не открывается рюкзак или машина</div>
      <pre>aposbow          состояние перезарядки лука в руках
aposbow off | on  выключить / включить автоналожение стрелы</pre>
    </article>
    <article class="card">
      <h3>Стелс</h3>
      <ul>
        <li>Зомби в зданиях, которые раньше выбегали волной после триггера или сразу бросались в атаку, теперь появляются спящими на своих местах, когда вы подходите. Триггеры (двери, лут, стены) их не будят. Зомби появляются заранее: за 12 м и с соседнего этажа (в игре за 8 м и только на вашем этаже), так что не возникают прямо у вас на глазах.</li>
        <li>Просыпаются от шума или когда вас увидят, так что можно подкрасться.</li>
        <li>Отключить: <code>&lt;Stealth rework="false"/&gt;</code> в Settings.xml и перезапустить игру.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Индикаторы-баффы</h3>
      <ul>
        <li>Bloodsucker — стаки регенерации ножа</li>
        <li>Counter Punch — заряды кастетов</li>
        <li>Veteran Junk — бонус самодельного оружия, %</li>
        <li>Headhunter — остаток усиленных выстрелов</li>
        <li>Rage — стаки</li>
        <li>Guardian Protocol, Energy Shield</li>
        <li>Перезарядка Earthquake и Chain Lightning</li>
        <li>Грозовые заряды Thunderclap, бесплатная ракета Big Boom</li>
        <li>Красное кольцо над зомби — на нём Mark арбалета</li>
        <li>Frenzy, Adrenaline (стаки), заряды молнии, Jackpot, Evasion</li>
        <li>Перезарядка Second Wind (5 мин) и Second Lungs (60 с)</li>
      </ul>
    </article>
    <article class="card"><h3>Птичьи гнёзда</h3><ul><li>Втрое больше перьев: из содержимого гнезда (3 + 3–15 вместо 1 + 1–5) и при сборе самого гнезда.</li></ul></article>
    <article class="card">
      <h3>Запуск</h3>
      <ul>
        <li>Запускайте игру <b>без EasyAntiCheat</b>, иначе мод не загрузится.</li>
        <li>В логе должно появиться <code>Loaded Mod: AposMod</code>.</li>
        <li>Игра может быть на русском или английском: тексты мода есть на обоих языках.</li>
      </ul>
    </article>
  </div>
</section>

<section id="elements" data-sec>
  <h2>Стихії та реакції</h2>
  <p class="lead">Три стихії: вогонь, струм і кислота. Дві стихії на одному зомбі запускають реакцію. Після неї в зомбі 3 с перезарядки реакцій.</p>
  <div class="grid">
    <article class="card reaction">
      <h3>Вогонь + кислота = <span class="trait">Explosion</span></h3><div class="formula" aria-hidden="true"><span class="el fire"><svg class="hi"><use href="#i-fire"/></svg></span>+<span class="el acid"><svg class="hi"><use href="#i-drop"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-bomb"/></svg></span></div>
      <ul><li>Вибух: 50% шкоди вашого останнього удару (щонайменше 60) цілі та всім зомбі в радіусі 4 м. Вас не зачіпає.</li></ul>
    </article>
    <article class="card reaction">
      <h3>Вогонь + струм = <span class="trait">Confusion</span></h3><div class="formula" aria-hidden="true"><span class="el fire"><svg class="hi"><use href="#i-fire"/></svg></span>+<span class="el shock"><svg class="hi"><use href="#i-bolt"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-eye"/></svg></span></div>
      <ul><li>5 с: зомбі повільніший на 60%, отримує більше шкоди (−30 опору), на мить оглушений.</li></ul>
    </article>
    <article class="card reaction">
      <h3>Струм + кислота = <span class="trait">Miasma</span></h3><div class="formula" aria-hidden="true"><span class="el shock"><svg class="hi"><use href="#i-bolt"/></svg></span>+<span class="el acid"><svg class="hi"><use href="#i-drop"/></svg></span>=<span class="el res"><svg class="hi"><use href="#i-flask"/></svg></span></div>
      <ul><li>6 с: максимальне здоров'я зомбі падає на 20%, разом із ним падає й поточне. Плюс кровотеча.</li></ul>
    </article>
    <article class="card">
      <h3>Звідки беруться стихії</h3>
      <ul>
        <li><b>Вогонь:</b> мод Incendiary, молотов, вогняні стріли, Splinter на 5 рівні, легендарки Dragon's Breath, Storm Fist, Artemis.</li>
        <li><b>Струм:</b> мод Tesla, жезли (Chain Lightning), легендарки Thunderclap, Storm Fist.</li>
        <li><b>Кислота:</b> мод Corrosive, легендарка Hornet.</li><li><b>Кровотеча</b> від ваших ударів (ножі, зубчасте лезо, колючий дріт, Ripper): щосекунди 5% шкоди останнього удару (щонайменше 5).</li><li>Ванільний мод <b>Burning Shaft</b> (палаючий держак) підпалює з шансом 5–30% замість 10–60%: його вогонь тепер теж залежить від шкоди удару.</li>
      </ul>
    </article>
  </div>
</section>

<section id="affixes" data-sec>
  <h2>Афікси</h2>
  <p class="lead">Зброя з луту, від зомбі й у торговців отримує випадкові афікси — бонуси до характеристик, як у Borderlands. Скрафчена зброя їх не має. Що вища якість, то більше афіксів і то вони сильніші.</p>

    <article class="card">

      <ul>
        <li><b>Якість 1:</b> без афіксів.</li>
        <li><b>Якість 2–3:</b> до 1 (шанс 50%).</li>
        <li><b>Якість 4–5:</b> до 2 (75% / 35%).</li>
        <li><b>Якість 6:</b> до 3 (100% / 60% / 30%), значення на максимумі.</li>
        <li>Однакових афіксів на одній зброї не буває. Після об'єднання двох гармат зайві афікси зникають.</li>
        <li>Афікси видно вгорі підказки предмета, а на іконці є значок-зірочка.</li>
      </ul>
    </article>
    <article class="card">
      <h3>Вогнепальна зброя, луки, ракетниця</h3>
      <div class="tagline">Значення: якість 2 → якість 6</div>
      <ul>
        <li><b>Скорострільність</b> +5% → +25%</li>
        <li><b>Розкид</b> −10% → −40%</li>
        <li><b>Дальність</b> +10% → +60%</li>
        <li><b>Шкода</b> +5% → +35%</li>
        <li><b>Швидкість перезарядки</b> +10% → +40%</li>
        <li><b>Дробини</b> (дробовики) +10% → +35%</li>
        <li><b>Друга куля</b> (пістолети, гвинтівки, автомати, лише якість 6): 2 кулі за постріл, кожна −40% шкоди</li>
        <li><b>Шкода в голову</b> +10% → +60%</li>
        <li><b>Розмір магазину</b> +10% → +60% (не на луках і арбалетах)</li>
        <li><b>Швидкість руху</b> зі зброєю в руках +2% → +10%</li>
        <li><b>Віддача</b> −10% → −50%</li>
      </ul>
    </article>
    <article class="card">
      <h3>Ближній бій</h3>
      <div class="tagline">Значення: якість 2 → якість 6</div>
      <ul>
        <li><b>Шкода</b> +5% → +35%</li>
        <li><b>Швидкість атаки</b> +4% → +20%</li>
